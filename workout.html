<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<script>(function(){try{var t=localStorage.getItem('global_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="./global_theme.css">
<style>
body{padding:1.5rem 1rem;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',monospace}
.container{max-width:900px;margin:0 auto;position:relative;z-index:1}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.75rem;gap:12px}
.page-title{font-size:17px;font-weight:600;letter-spacing:.02em;margin-bottom:2px}
.page-sub{font-size:11px;color:var(--text-muted)}
.header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}

/* PR Bar */
.pr-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.2rem}
.pr-card{background:var(--bg-card);backdrop-filter:var(--blur);border:1px solid var(--border-glass);border-radius:var(--rl);padding:13px 15px;text-align:center;box-shadow:var(--shadow-card)}
.pr-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:6px}
.pr-input{font-family:inherit;font-size:20px;font-weight:700;color:var(--green);background:transparent;border:none;border-bottom:2px solid transparent;outline:none;width:90px;text-align:center;transition:border-color .2s}
.pr-input:focus{border-bottom-color:var(--green)}
.pr-unit{font-size:10px;color:var(--text-muted)}

/* Program tabs */
.prog-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.prog-tab{font-family:inherit;font-size:11px;font-weight:600;padding:6px 16px;border-radius:20px;border:1.5px solid var(--border-subtle);background:var(--bg-card);backdrop-filter:var(--blur);color:var(--text-muted);cursor:pointer;transition:all .15s}
.prog-tab.active{background:var(--blue-bg);color:var(--blue-txt);border-color:var(--blue)}
.prog-tab:hover:not(.active){background:var(--bg-glass-hover);color:var(--text-primary)}
.upload-tab{border-style:dashed;display:flex;align-items:center;gap:5px}
.upload-tab:hover{border-color:var(--green);color:var(--green)}

/* Day + Week selectors */
.day-week-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:1.2rem}
.day-tabs,.week-tabs{display:flex;gap:4px}
.day-tab,.week-tab{font-family:inherit;font-size:11px;font-weight:600;padding:5px 13px;border-radius:16px;border:1.5px solid var(--border-subtle);background:var(--bg-card);color:var(--text-muted);cursor:pointer;transition:all .15s}
.day-tab.active{background:var(--purple-bg);color:var(--purple);border-color:var(--purple)}
.week-tab.active{background:var(--amber-bg);color:var(--amber-txt);border-color:var(--amber)}
.week-tabs{margin-left:auto}

/* Section blocks */
.section-block{margin-bottom:1.2rem}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);padding:5px 10px;background:var(--bg-card2);border-radius:var(--r);margin-bottom:8px;display:inline-block;border:1px solid var(--border-subtle)}

/* Exercise card */
.exercise-card{background:var(--bg-card);backdrop-filter:var(--blur);border:1px solid var(--border-glass);border-radius:var(--rl);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow-card)}
.ex-header{padding:10px 14px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-name{font-size:13px;font-weight:700;color:var(--text-primary)}
.ex-label{font-size:10px;font-weight:600;color:var(--blue-txt);text-transform:uppercase;letter-spacing:.06em;background:var(--blue-bg);padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.ex-cue{font-size:10px;color:var(--text-muted);font-style:italic;padding:6px 14px;border-bottom:1px solid var(--border-subtle);line-height:1.5;background:var(--bg-card2)}
.ex-sets{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.set-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.set-num{font-size:10px;font-weight:600;color:var(--text-muted);min-width:36px;text-transform:uppercase;letter-spacing:.06em}
.set-prescribed{font-size:12px;font-weight:600;color:var(--text-primary);min-width:60px}
.set-tempo{font-size:10px;color:var(--text-muted);min-width:44px}
.set-weight{width:72px;font-family:inherit;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--bg-input);color:var(--green);text-align:right;transition:border-color .15s}
.set-weight:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.set-last{font-size:10px;color:var(--text-muted);font-style:italic}

/* Conditioning */
.cond-card{background:var(--bg-card);border:1px solid var(--border-glass);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;font-size:12px;color:var(--text-secondary);line-height:1.6}
.cond-label{font-size:10px;font-weight:700;color:var(--amber-txt);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}

/* RPE + Log button */
.session-footer{background:var(--bg-card);border:1px solid var(--border-glass);border-radius:var(--rl);padding:14px 16px;margin-top:.5rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rpe-label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
.rpe-input{width:60px;font-family:inherit;font-size:14px;font-weight:700;padding:5px 8px;border-radius:8px;border:1px solid var(--border2);background:var(--bg-input);color:var(--amber-txt);text-align:center;transition:border-color .15s}
.rpe-input:focus{outline:none;border-color:var(--amber)}
.rpe-scale{font-size:10px;color:var(--text-muted);flex:1}
.session-notes{flex:2;min-width:140px;font-family:inherit;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--bg-input);color:var(--text-primary);outline:none}
.session-notes:focus{border-color:var(--blue)}

/* History */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin:1.4rem 0 .6rem;padding-bottom:5px;border-bottom:1px solid var(--border-subtle);cursor:pointer;user-select:none}
.sec-label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.12em}
.sec-toggle{font-size:14px;color:var(--text-muted);transition:transform .2s}
.sec-toggle.open{transform:rotate(180deg)}
.sec-body.collapsed{display:none}
.hist-item{background:var(--bg-card);border:1px solid var(--border-glass);border-radius:var(--r);padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hist-item:hover{border-color:var(--border2)}
.hi-main{font-size:12px;font-weight:600;color:var(--text-primary)}
.hi-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.hi-del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:0;font-family:inherit;transition:color .15s}
.hi-del:hover{color:var(--red)}
.empty-state{text-align:center;padding:2rem;color:var(--text-muted);font-size:12px;border:1px dashed var(--border2);border-radius:var(--r);background:var(--bg-card)}
.pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.pill-g{background:var(--green-bg);color:var(--green-txt)}.pill-b{background:var(--blue-bg);color:var(--blue-txt)}.pill-a{background:var(--amber-bg);color:var(--amber-txt)}
.saving-indicator{position:fixed;bottom:1rem;right:1rem;background:var(--green-bg);color:var(--green-txt);border:1px solid var(--green);border-radius:20px;padding:5px 14px;font-size:11px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100;backdrop-filter:var(--blur);font-family:inherit}
.saving-indicator.show{opacity:1}
</style>
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div class="saving-indicator" id="saving-indicator">Saved</div>

<div class="container">
<div class="header">
  <div>
    <div class="page-title">Workout Tracker</div>
    <div class="page-sub">Etown Golf · upload program CSVs · log weights per session</div>
  </div>
  <div class="header-actions">
    <a href="index.html" class="btn">← home</a>
    <button class="btn" onclick="toggleTheme()" id="theme-btn">◑ dark</button>
  </div>
</div>

<!-- PR TRACKER -->
<div class="pr-bar">
  <div class="pr-card"><div class="pr-label">Squat PR</div><input class="pr-input" id="pr-squat" type="number" placeholder="0" oninput="savePRs()"><div class="pr-unit">lbs</div></div>
  <div class="pr-card"><div class="pr-label">Bench PR</div><input class="pr-input" id="pr-bench" type="number" placeholder="0" oninput="savePRs()"><div class="pr-unit">lbs</div></div>
  <div class="pr-card"><div class="pr-label">Deadlift PR</div><input class="pr-input" id="pr-dead" type="number" placeholder="0" oninput="savePRs()"><div class="pr-unit">lbs</div></div>
</div>

<!-- PROGRAM TABS -->
<div class="prog-tabs" id="prog-tabs"></div>

<!-- PROGRAM VIEW -->
<div id="program-view"></div>

<!-- SESSION HISTORY -->
<div class="sec-header" onclick="toggleSec('history')">
  <span class="sec-label">Session History</span>
  <span class="sec-toggle" id="toggle-history">▼</span>
</div>
<div class="sec-body collapsed" id="sec-history">
  <div id="history-list"></div>
</div>

<!-- Hidden file input -->
<input type="file" id="csv-input" accept=".csv" style="display:none" onchange="handleCSV(this)">
</div>

<script>
// ── STATE ─────────────────────────────────────────────────
let programs = JSON.parse(localStorage.getItem('wt_programs') || '[]');
let sessions = JSON.parse(localStorage.getItem('wt_sessions') || '[]');
let prs      = JSON.parse(localStorage.getItem('wt_prs') || '{"squat":"","bench":"","dead":""}');
let idC      = parseInt(localStorage.getItem('wt_id') || '1', 10);
let activeProgIdx = 0;
let activeDay  = 0;
let activeWeek = 0;
let liveWeights = {}; // "exKey-setIdx" -> weight string
let liveRPE = '';
let liveNotes = '';

function save(){
  localStorage.setItem('wt_programs', JSON.stringify(programs));
  localStorage.setItem('wt_sessions', JSON.stringify(sessions));
  localStorage.setItem('wt_id', idC);
  showSaved();
}
function savePRs(){
  prs.squat = document.getElementById('pr-squat').value;
  prs.bench = document.getElementById('pr-bench').value;
  prs.dead  = document.getElementById('pr-dead').value;
  localStorage.setItem('wt_prs', JSON.stringify(prs));
}
function showSaved(){
  const el = document.getElementById('saving-indicator');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1400);
}
function g(id){ return document.getElementById(id); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── CSV PARSER ─────────────────────────────────────────────
// Parses trainer CSV format into structured program object
function parseCSV(text, filename){
  const rows = text.split('\n').map(r => r.split(',').map(c => c.replace(/^"|"$/g,'').trim()));
  
  // Program name from row 1
  const nameRow = rows[1] || [];
  const progName = nameRow.filter(v=>v&&!['1-2','Rest-Easy'].includes(v)).slice(0,2).join(' ') || filename;

  // Day layout: row 6 has "Day 1", "Day 2", "Day 3"
  // Row 7 has WEEK 1..4 repeated 3 times (columns 0-3=Day1, 4-7=Day2, 8-11=Day3 roughly)
  // Each day occupies ~12-14 columns based on exercises

  // Parse by finding column offsets for each day
  const dayRow = rows[6] || [];
  const dayStarts = [];
  dayRow.forEach((v,i) => { if(v && v.startsWith('Day')) dayStarts.push(i); });
  if(dayStarts.length === 0) dayStarts.push(0, 12, 24); // fallback

  const days = [];
  for(let d = 0; d < 3; d++){
    const colStart = dayStarts[d] || d*13;
    const colEnd = dayStarts[d+1] || colStart+13;
    days.push(parseDay(rows, colStart, colEnd, d+1));
  }

  return { id: 'prog-'+idC++, name: progName, days };
}

function getRowSlice(row, start, end){
  const slice = [];
  for(let i = start; i < end && i < row.length; i++){
    slice.push(row[i] || '');
  }
  return slice;
}

function parseDay(rows, colStart, colEnd, dayNum){
  const sections = [];
  let i = 12; // Start after headers

  // POWER section (rows ~12-19)
  const powerExercises = [];
  if(rows[13]){
    const exNames = getRowSlice(rows[13], colStart, colEnd).filter(v=>v && v !== 'POWER');
    const exCues  = getRowSlice(rows[14]||[], colStart, colEnd);
    // Each exercise gets one column in this section
    exNames.forEach((name, ei) => {
      if(!name) return;
      const sets = [];
      for(let s = 15; s <= 18; s++){
        const row = rows[s] || [];
        // Each exercise col has val + possibly 'x' marker
        const colIdx = colStart + ei;
        const val = row[colIdx] || '';
        if(val && val !== 'x' && val !== 'HT:') sets.push(val);
      }
      if(sets.length > 0){
        powerExercises.push({ name, cue: exCues[ei]||'', sets: makeSets(sets), label: '' });
      }
    });
  }
  if(powerExercises.length > 0){
    sections.push({ title:'Power', restNote:'Rest 60s Btw Sets', exercises: powerExercises });
  }

  // STRENGTH section (rows ~22-34)
  const strengthExercises = [];
  if(rows[22]){
    const exRow = getRowSlice(rows[22], colStart, colEnd);
    const cueRow = getRowSlice(rows[23]||[], colStart, colEnd);
    // 1A exercise
    const ex1A = exRow.filter(v=>v && (v.includes('1A') || v === 'STRENGTH')).find(v=>v.includes('1A'));
    const ex1B_r29 = rows[29] ? getRowSlice(rows[29], colStart, colEnd).find(v=>v && v.includes('1B')) : null;
    const label1A = ex1A || '';
    const name1A = label1A.replace(/^1A:\s*/,'').trim();
    if(name1A){
      const sets1A = [];
      for(let s = 24; s <= 27; s++){
        const row = rows[s]||[];
        const v = row[colStart];
        const tempo = row[colStart+1]||'';
        if(v && v !== 'nan') sets1A.push({reps:v, tempo:tempo});
      }
      strengthExercises.push({ name: name1A, cue: cueRow[0]||'', sets: sets1A, label:'1A' });
    }
    if(ex1B_r29){
      const name1B = ex1B_r29.replace(/^1B:\s*/,'').trim();
      const cue1B = rows[30] ? (getRowSlice(rows[30], colStart, colEnd)[0]||'') : '';
      const sets1B = [];
      for(let s = 31; s <= 34; s++){
        const row = rows[s]||[];
        const v = row[colStart];
        const tempo = row[colStart+1]||'';
        if(v && v !== 'nan') sets1B.push({reps:v, tempo});
      }
      strengthExercises.push({ name: name1B, cue: cue1B, sets: sets1B, label:'1B' });
    }
  }
  if(strengthExercises.length > 0){
    sections.push({ title:'Strength', restNote:'No Rest Btw Exercises, 90s Btw Tri-Set', exercises: strengthExercises });
  }

  // CORE & AUXILIARY section (rows ~38-52)
  const coreExercises = [];
  if(rows[38]){
    const exRow = getRowSlice(rows[38], colStart, colEnd);
    const cueRow = getRowSlice(rows[39]||[], colStart, colEnd);
    ['2A','2B','2C'].forEach((label, li) => {
      const rowOffset = [38, 43, 48][li];
      const setsOffset = [40, 45, 50][li];
      if(!rows[rowOffset]) return;
      const exRow2 = getRowSlice(rows[rowOffset], colStart, colEnd);
      const exName = exRow2.find(v=>v && v.includes(label));
      if(!exName) return;
      const name = exName.replace(new RegExp(`^${label}:\\s*`), '').trim();
      const cueRow2 = rows[rowOffset+1] ? getRowSlice(rows[rowOffset+1], colStart, colEnd) : [];
      const sets = [];
      for(let s = setsOffset; s <= setsOffset+2; s++){
        if(!rows[s]) continue;
        const v = rows[s][colStart]||'';
        const tempo = rows[s][colStart+1]||'';
        if(v && v !== 'nan') sets.push({reps:v, tempo});
      }
      coreExercises.push({ name, cue: cueRow2[0]||'', sets, label });
    });
  }
  if(coreExercises.length > 0){
    sections.push({ title:'Core & Auxiliary', restNote:'No Rest Btw Exercises, 60s Btw Tri-Set', exercises: coreExercises });
  }

  // CONDITIONING (row 54)
  let conditioning = '';
  if(rows[54]){
    const condRow = getRowSlice(rows[54], colStart, colEnd);
    conditioning = condRow.filter(v=>v && v !== 'COND').join(' ').trim();
  }

  return { label: `Day ${dayNum}`, sections, conditioning };
}

function makeSets(vals){
  return vals.filter(Boolean).map(v => ({reps: v, tempo: ''}));
}

// ── HANDLE CSV UPLOAD ──────────────────────────────────────
window.triggerUpload = function(){ g('csv-input').click(); };
window.handleCSV = function(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const prog = parseCSV(e.target.result, file.name.replace('.csv','').replace(/_/g,' '));
      programs.push(prog);
      activeProgIdx = programs.length - 1;
      activeDay = 0; activeWeek = 0;
      liveWeights = {}; liveRPE = ''; liveNotes = '';
      save();
      renderAll();
    } catch(err){
      alert('Error parsing CSV: ' + err.message);
    }
  };
  reader.readAsText(file, 'latin1');
  input.value = '';
};

// ── RENDER ─────────────────────────────────────────────────
function renderAll(){
  renderProgTabs();
  renderProgram();
  renderHistory();
}

function renderProgTabs(){
  const el = g('prog-tabs');
  let html = programs.map((p,i) => 
    `<button class="prog-tab${i===activeProgIdx?' active':''}" onclick="selectProg(${i})">${esc(p.name)}</button>`
  ).join('');
  html += `<button class="prog-tab upload-tab" onclick="triggerUpload()"><span style="font-size:15px;font-weight:300">+</span> Upload CSV</button>`;
  el.innerHTML = html;
}

window.selectProg = function(i){
  activeProgIdx = i; activeDay = 0; activeWeek = 0;
  liveWeights = {}; liveRPE = ''; liveNotes = '';
  renderProgTabs(); renderProgram();
};

function renderProgram(){
  const pv = g('program-view');
  if(programs.length === 0){
    pv.innerHTML = `<div class="empty-state">No programs yet.<br><br>Click <strong>+ Upload CSV</strong> to upload your trainer's program sheet.</div>`;
    return;
  }
  const prog = programs[activeProgIdx];
  if(!prog){ pv.innerHTML=''; return; }
  const day = prog.days[activeDay];

  let html = `<div class="day-week-bar">
    <div class="day-tabs">`;
  prog.days.forEach((d,i) => {
    html += `<button class="day-tab${i===activeDay?' active':''}" onclick="selectDay(${i})">${esc(d.label)}</button>`;
  });
  html += `</div><div class="week-tabs">`;
  ['Wk 1','Wk 2','Wk 3','Wk 4'].forEach((w,i) => {
    html += `<button class="week-tab${i===activeWeek?' active':''}" onclick="selectWeek(${i})">${w}</button>`;
  });
  html += `</div></div>`;

  if(!day){
    html += `<div class="empty-state">No data for this day.</div>`;
    pv.innerHTML = html; return;
  }

  let exGlobalIdx = 0;
  day.sections.forEach(sec => {
    html += `<div class="section-block"><span class="section-title">${esc(sec.title)}</span>`;
    if(sec.restNote){
      html += `<div style="font-size:10px;color:var(--text-muted);margin-bottom:8px;font-style:italic">${esc(sec.restNote)}</div>`;
    }
    sec.exercises.forEach(ex => {
      const exKey = `${activeProgIdx}-${activeDay}-${exGlobalIdx}`;
      const lastW = getLastWeight(activeProgIdx, activeDay, exKey);
      const sets = ex.sets || [];
      // For week-specific reps: use activeWeek index if available
      html += `<div class="exercise-card">
        <div class="ex-header">
          <div class="ex-name">${esc(ex.name)}</div>
          ${ex.label?`<span class="ex-label">${esc(ex.label)}</span>`:''}
        </div>
        ${ex.cue?`<div class="ex-cue">${esc(ex.cue)}</div>`:''}
        <div class="ex-sets">`;
      sets.forEach((set, si) => {
        const wKey = `${exGlobalIdx}-${si}`;
        const storedW = liveWeights[wKey]||'';
        const reps = Array.isArray(set.reps) ? (set.reps[activeWeek]||set.reps[set.reps.length-1]) : set.reps;
        html += `<div class="set-row">
          <span class="set-num">Set ${si+1}</span>
          <span class="set-prescribed">${esc(String(reps||''))}</span>
          <span class="set-tempo">${esc(set.tempo||'')}</span>
          <input class="set-weight" type="number" placeholder="lbs" value="${esc(storedW)}"
            oninput="liveWeights['${wKey}']=this.value" title="Weight used">
          ${lastW&&si===0?`<span class="set-last">last: ${esc(lastW)}</span>`:''}
        </div>`;
      });
      html += `</div></div>`;
      exGlobalIdx++;
    });
    html += `</div>`;
  });

  // Conditioning
  if(day.conditioning){
    html += `<div class="cond-card"><div class="cond-label">Conditioning</div>${esc(day.conditioning)}</div>`;
  }

  // RPE + save
  html += `<div class="session-footer">
    <span class="rpe-label">RPE</span>
    <input class="rpe-input" type="number" min="1" max="10" placeholder="1-10"
      value="${esc(liveRPE)}" oninput="liveRPE=this.value">
    <span class="rpe-scale">1-2 easy · 3-4 mod · 5-7 hard · 8-9 really hard · 10 max</span>
    <input class="session-notes" type="text" placeholder="Session notes..." value="${esc(liveNotes)}" oninput="liveNotes=this.value">
    <button class="btn btn-green" onclick="logSession()">Log Session</button>
    <button class="btn btn-red" onclick="deleteProg(${activeProgIdx})" style="opacity:.6">Delete Program</button>
  </div>`;

  pv.innerHTML = html;
}

window.selectDay  = function(i){ activeDay=i; liveWeights={}; liveRPE=''; liveNotes=''; renderProgram(); };
window.selectWeek = function(i){ activeWeek=i; renderProgram(); };

function getLastWeight(progIdx, dayIdx, exKey){
  const prev = sessions.filter(s=>s.progIdx===progIdx&&s.dayIdx===dayIdx)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  for(const s of prev){
    if(s.weights&&s.weights[exKey]){
      const w = Object.values(s.weights).filter(Boolean).join(', ');
      if(w) return Object.entries(s.weights).filter(([k])=>k.startsWith(exKey.split('-')[2])).map(([,v])=>v).filter(Boolean).join(', ') || null;
    }
  }
  return null;
}

// ── LOG SESSION ────────────────────────────────────────────
window.logSession = function(){
  const prog = programs[activeProgIdx];
  if(!prog) return;
  const day = prog.days[activeDay];
  sessions.unshift({
    id: idC++,
    progIdx: activeProgIdx,
    progName: prog.name,
    dayIdx: activeDay,
    dayLabel: day?.label||`Day ${activeDay+1}`,
    week: activeWeek+1,
    date: new Date().toISOString(),
    rpe: liveRPE,
    notes: liveNotes,
    weights: {...liveWeights},
  });
  save();
  liveWeights={}; liveRPE=''; liveNotes='';
  renderProgram(); renderHistory();
  alert('Session logged!');
};

window.deleteProg = function(i){
  if(!confirm('Delete this program and all its sessions?')) return;
  const progId = programs[i]?.id;
  programs.splice(i,1);
  sessions = sessions.filter(s=>s.progIdx!==i);
  // Re-index session progIdx
  sessions.forEach(s=>{ if(s.progIdx>i) s.progIdx--; });
  activeProgIdx = Math.max(0, i-1);
  activeDay=0; activeWeek=0;
  save(); renderAll();
};

// ── HISTORY ────────────────────────────────────────────────
function renderHistory(){
  const el = g('history-list');
  if(sessions.length===0){ el.innerHTML='<div class="empty-state">No sessions logged yet.</div>'; return; }
  el.innerHTML = sessions.slice(0,30).map(s=>{
    const d = new Date(s.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    return `<div class="hist-item">
      <div>
        <div class="hi-main">${esc(s.progName||'')} — ${esc(s.dayLabel)} Week ${s.week}</div>
        <div class="hi-meta">${d}${s.rpe?' · RPE '+s.rpe:''}${s.notes?' · '+s.notes:''}</div>
      </div>
      <button class="hi-del" onclick="deleteSession(${s.id})">✕</button>
    </div>`;
  }).join('');
}

window.deleteSession = function(id){
  sessions=sessions.filter(s=>s.id!==id);
  save(); renderHistory();
};

// ── UTILS ─────────────────────────────────────────────────
function toggleSec(id){
  g('sec-'+id).classList.toggle('collapsed');
  g('toggle-'+id).classList.toggle('open');
}
window.toggleSec = toggleSec;

function toggleTheme(){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',isDark?'light':'dark');
  g('theme-btn').textContent=isDark?'◑ dark':'◑ light';
  try{localStorage.setItem('global_theme',isDark?'light':'dark');}catch(e){}
}
window.toggleTheme=toggleTheme;

// ── INIT ──────────────────────────────────────────────────
const savedTheme=localStorage.getItem('global_theme');
g('theme-btn').textContent=savedTheme==='dark'?'◑ light':'◑ dark';
g('pr-squat').value=prs.squat||'';
g('pr-bench').value=prs.bench||'';
g('pr-dead').value=prs.dead||'';
renderAll();
</script>
