<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roth IRA Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--bg2:#ffffff;--bg3:#efefed;--bg4:#e4e4e2;
  --border:#dddddb;--border2:#c8c8c6;
  --text:#1a1a1a;--text2:#555;--text3:#999;--text4:#bbb;
  --green:#0e9e70;--green-bg:#e0f5ec;--green-txt:#0e9e70;
  --amber:#c27d08;--amber-bg:#fdf0d5;--amber-txt:#c27d08;
  --blue:#2a7de1;--blue-bg:#deeafa;--blue-txt:#2a7de1;
  --red:#d03030;--red-bg:#fce8e8;--red-txt:#d03030;
  --purple:#6c5bbf;--purple-bg:#eae8fa;
  --r:8px;--rl:12px;
  --limit:7500;
}
.dark{
  --bg:#1e1e1e;--bg2:#272727;--bg3:#2f2f2f;--bg4:#383838;
  --border:#3a3a3a;--border2:#484848;
  --text:#e2e2e2;--text2:#a0a0a0;--text3:#666;--text4:#444;
  --green:#1fbd8a;--green-bg:#0d2e22;--green-txt:#1fbd8a;
  --amber:#e6a020;--amber-bg:#2c1f06;--amber-txt:#e6a020;
  --blue:#4a9eff;--blue-bg:#0a1e35;--blue-txt:#4a9eff;
  --red:#f05050;--red-bg:#2a0f0f;--red-txt:#f05050;
  --purple:#9b87f5;--purple-bg:#1a1530;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'SF Mono','Fira Code','Cascadia Code',monospace;
  font-size:13px;line-height:1.6;
  padding:1.5rem 1rem;
  transition:background .2s,color .2s;
  min-height:100vh;
}
.container{max-width:820px;margin:0 auto}

.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.75rem}
.page-title{font-size:17px;font-weight:600;letter-spacing:.02em;margin-bottom:2px}
.page-sub{font-size:11px;color:var(--text3);letter-spacing:.03em}
.header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn{font-family:inherit;font-size:11px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .15s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--bg4);color:var(--text)}
.btn-green{background:var(--green-bg);color:var(--green-txt);border-color:var(--green)}
.btn-green:hover{opacity:.85}

hr{border:none;border-top:1px solid var(--border);margin:1.4rem 0}

.sec-header{display:flex;align-items:center;justify-content:space-between;margin:1.6rem 0 .55rem;padding-bottom:5px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.sec-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.12em}
.sec-toggle{font-size:14px;color:var(--text3);transition:transform .2s;line-height:1}
.sec-toggle.open{transform:rotate(180deg)}
.sec-body.collapsed{display:none}

/* Progress hero */
.progress-hero{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:20px 22px;margin-bottom:1rem}
.ph-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.ph-contributed{font-size:28px;font-weight:600;color:var(--green);letter-spacing:-.02em}
.ph-limit{font-size:13px;color:var(--text3)}
.ph-track{height:10px;background:var(--bg4);border-radius:5px;overflow:hidden;margin-bottom:8px;border:1px solid var(--border)}
.ph-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green),#34d399);transition:width .4s ease}
.ph-bottom{display:flex;justify-content:space-between;align-items:center}
.ph-pct{font-size:12px;font-weight:600;color:var(--green)}
.ph-remaining{font-size:12px;color:var(--text3)}

/* Metrics */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:.5rem 0 1rem}
.met{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.met-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.met-val{font-size:19px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.met-val.green{color:var(--green)}
.met-val.blue{color:var(--blue)}
.met-val.amber{color:var(--amber)}
.met-val.red{color:var(--red)}
.met-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* Deposit entry */
.entry-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:1rem}
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:flex-end}
.form-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:120px}
.form-group label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.form-group input{
  font-family:inherit;font-size:12px;
  padding:5px 9px;border-radius:6px;
  border:1px solid var(--border2);
  background:var(--bg3);color:var(--text);
  transition:border-color .15s;
}
.form-group input:focus{outline:none;border-color:var(--green)}
.form-actions{display:flex;justify-content:flex-end}

/* Deposit list */
.deposit-list{display:flex;flex-direction:column;gap:5px}
.deposit-item{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:8px 12px;display:flex;align-items:center;justify-content:space-between;
}
.deposit-item:hover{border-color:var(--border2)}
.di-left{display:flex;flex-direction:column;gap:1px}
.di-label{font-size:12px;color:var(--text)}
.di-date{font-size:11px;color:var(--text3)}
.di-right{display:flex;align-items:center;gap:12px}
.di-amt{font-size:13px;font-weight:600;color:var(--green)}
.di-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:14px;padding:0;font-family:inherit;transition:color .15s}
.di-del:hover{color:var(--red)}

.empty-state{text-align:center;padding:2rem;color:var(--text3);font-size:12px;border:1px dashed var(--border2);border-radius:var(--r)}

.pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.pill-g{background:var(--green-bg);color:var(--green-txt)}
.pill-a{background:var(--amber-bg);color:var(--amber-txt)}
.pill-r{background:var(--red-bg);color:var(--red-txt)}
.pill-b{background:var(--blue-bg);color:var(--blue-txt)}

/* Pace bar */
.pace-row{display:flex;align-items:center;gap:10px;margin:.5rem 0}
.pace-label{font-size:11px;color:var(--text3);min-width:90px}
.pace-track{flex:1;height:7px;background:var(--bg3);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.pace-fill{height:100%;border-radius:3px;transition:width .3s}
.pace-pct{font-size:11px;font-weight:600;color:var(--text);min-width:36px;text-align:right}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="page-title">Paul's 2026 Roth IRA</div>
      <div class="page-sub">contribution tracker · $7,500 annual limit</div>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn">← home</a>
      <button class="btn" onclick="toggleTheme()" id="theme-btn">◑ dark</button>
    </div>
  </div>

  <!-- Progress hero -->
  <div class="progress-hero">
    <div class="ph-top">
      <span class="ph-contributed" id="hero-contributed">$0.00</span>
      <span class="ph-limit">of $7,500.00 limit</span>
    </div>
    <div class="ph-track">
      <div class="ph-fill" id="hero-fill" style="width:0%"></div>
    </div>
    <div class="ph-bottom">
      <span class="ph-pct" id="hero-pct">0.0% complete</span>
      <span class="ph-remaining" id="hero-remaining">$7,500.00 remaining</span>
    </div>
  </div>

  <!-- Metrics -->
  <div class="pgrid">
    <div class="met">
      <div class="met-label">Contributed</div>
      <div class="met-val green" id="met-contributed">$0.00</div>
      <div class="met-sub">year to date</div>
    </div>
    <div class="met">
      <div class="met-label">Remaining</div>
      <div class="met-val blue" id="met-remaining">$7,500.00</div>
      <div class="met-sub">to hit limit</div>
    </div>
    <div class="met">
      <div class="met-label">On Track</div>
      <div class="met-val" id="met-status">—</div>
      <div class="met-sub" id="met-status-sub"></div>
    </div>
    <div class="met">
      <div class="met-label">Proj. Finish</div>
      <div class="met-val" id="met-proj" style="font-size:14px">—</div>
      <div class="met-sub" id="met-proj-sub"></div>
    </div>
  </div>

  <!-- Pace comparison -->
  <div class="sec-header" onclick="toggleSec('pace')">
    <span class="sec-label">Year Pace</span>
    <span class="sec-toggle open" id="toggle-pace">▼</span>
  </div>
  <div class="sec-body" id="sec-pace">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:.5rem">
      <div class="pace-row">
        <span class="pace-label">Contributed</span>
        <div class="pace-track"><div class="pace-fill" id="pace-contributed" style="width:0%;background:var(--green)"></div></div>
        <span class="pace-pct" id="pace-contributed-pct">0%</span>
      </div>
      <div class="pace-row">
        <span class="pace-label">Year elapsed</span>
        <div class="pace-track"><div class="pace-fill" id="pace-year" style="width:0%;background:var(--blue)"></div></div>
        <span class="pace-pct" id="pace-year-pct">0%</span>
      </div>
    </div>
    <div style="font-size:11px;color:var(--text3);padding:0 2px" id="pace-note"></div>
  </div>

  <!-- Log deposit -->
  <div class="sec-header" onclick="toggleSec('entry')">
    <span class="sec-label">Log a Deposit</span>
    <span class="sec-toggle open" id="toggle-entry">▼</span>
  </div>
  <div class="sec-body" id="sec-entry">
    <div class="entry-card">
      <div class="form-row">
        <div class="form-group">
          <label>Label</label>
          <input type="text" id="f-label" placeholder="e.g. May contribution">
        </div>
        <div class="form-group" style="max-width:140px">
          <label>Date</label>
          <input type="date" id="f-date">
        </div>
        <div class="form-group" style="max-width:120px">
          <label>Amount ($)</label>
          <input type="number" id="f-amount" step="0.01" min="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-green" onclick="logDeposit()">+ Add Deposit</button>
      </div>
    </div>
  </div>

  <!-- Deposit history -->
  <div class="sec-header" onclick="toggleSec('history')">
    <span class="sec-label">Deposit History</span>
    <span class="sec-toggle open" id="toggle-history">▼</span>
  </div>
  <div class="sec-body" id="sec-history">
    <div class="deposit-list" id="deposit-list"></div>
  </div>

</div>

<script>
const LIMIT = 7500;
let deposits = JSON.parse(localStorage.getItem('ira_deposits') || '[]');

function fmt$(n){ return '$'+n.toFixed(2); }

function getTotal(){ return deposits.reduce((s,d) => s + d.amount, 0); }

function yearPct(){
  const now   = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const end   = new Date(now.getFullYear(), 11, 31, 23, 59, 59);
  return (now - start) / (end - start);
}

function projFinish(total, pacePerDay){
  if(pacePerDay <= 0) return null;
  const remaining = LIMIT - total;
  if(remaining <= 0) return 'Done';
  const days = Math.ceil(remaining / pacePerDay);
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function renderAll(){
  const total     = getTotal();
  const remaining = Math.max(0, LIMIT - total);
  const pct       = Math.min(100, total / LIMIT * 100);
  const yPct      = yearPct() * 100;
  const ahead     = pct >= yPct;

  // Hero
  document.getElementById('hero-contributed').textContent = fmt$(total);
  document.getElementById('hero-fill').style.width = pct.toFixed(2) + '%';
  document.getElementById('hero-pct').textContent  = pct.toFixed(1) + '% complete';
  document.getElementById('hero-remaining').textContent = fmt$(remaining) + ' remaining';

  // Metrics
  document.getElementById('met-contributed').textContent = fmt$(total);
  document.getElementById('met-remaining').textContent   = fmt$(remaining);

  const statusEl    = document.getElementById('met-status');
  const statusSubEl = document.getElementById('met-status-sub');
  if(total >= LIMIT){
    statusEl.innerHTML = '<span class="pill pill-g">Maxed</span>';
    statusSubEl.textContent = 'limit reached';
  } else if(ahead){
    statusEl.innerHTML = '<span class="pill pill-g">Ahead</span>';
    statusSubEl.textContent = (pct - yPct).toFixed(1) + '% ahead of pace';
  } else {
    statusEl.innerHTML = '<span class="pill pill-a">Behind</span>';
    statusSubEl.textContent = (yPct - pct).toFixed(1) + '% behind pace';
  }

  // Projected finish
  const projEl    = document.getElementById('met-proj');
  const projSubEl = document.getElementById('met-proj-sub');
  if(deposits.length >= 2){
    const sorted  = [...deposits].sort((a,b) => new Date(a.date) - new Date(b.date));
    const firstD  = new Date(sorted[0].date + 'T00:00:00');
    const daysSince = Math.max(1, (new Date() - firstD) / 86400000);
    const pace    = total / daysSince;
    const finish  = projFinish(total, pace);
    projEl.textContent    = finish || '—';
    projSubEl.textContent = finish === 'Done' ? 'limit reached' : 'at current pace';
  } else {
    projEl.textContent    = '—';
    projSubEl.textContent = 'log more deposits';
  }

  // Pace bars
  document.getElementById('pace-contributed').style.width    = pct.toFixed(2) + '%';
  document.getElementById('pace-contributed-pct').textContent = Math.round(pct) + '%';
  document.getElementById('pace-year').style.width           = yPct.toFixed(2) + '%';
  document.getElementById('pace-year-pct').textContent       = Math.round(yPct) + '%';
  document.getElementById('pace-note').textContent           = ahead
    ? 'You are ahead of a straight-line pace to max by Dec 31.'
    : 'You are behind a straight-line pace to max by Dec 31.';

  // Deposit list
  const list = document.getElementById('deposit-list');
  if(deposits.length === 0){
    list.innerHTML = '<div class="empty-state">No deposits logged yet.</div>';
    return;
  }
  const sorted = [...deposits].sort((a,b) => new Date(b.date) - new Date(a.date));
  list.innerHTML = '';
  sorted.forEach(d => {
    const fmtDate = new Date(d.date + 'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    const div = document.createElement('div');
    div.className = 'deposit-item';
    div.innerHTML = `
      <div class="di-left">
        <span class="di-label">${d.label || 'Deposit'}</span>
        <span class="di-date">${fmtDate}</span>
      </div>
      <div class="di-right">
        <span class="di-amt">${fmt$(d.amount)}</span>
        <button class="di-del" onclick="deleteDeposit(${d.id})" title="Remove">✕</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function logDeposit(){
  const label  = document.getElementById('f-label').value.trim();
  const date   = document.getElementById('f-date').value;
  const amount = parseFloat(document.getElementById('f-amount').value);

  if(!date || isNaN(amount) || amount <= 0){ alert('Please enter a valid date and amount.'); return; }

  const total = getTotal();
  if(total + amount > LIMIT){
    if(!confirm(`This deposit would bring your total to ${fmt$(total+amount)}, over the $7,500 limit. Add anyway?`)) return;
  }

  deposits.push({ id: Date.now(), label, date, amount });
  localStorage.setItem('ira_deposits', JSON.stringify(deposits));

  document.getElementById('f-label').value  = '';
  document.getElementById('f-amount').value = '';
  renderAll();
}

function deleteDeposit(id){
  deposits = deposits.filter(d => d.id !== id);
  localStorage.setItem('ira_deposits', JSON.stringify(deposits));
  renderAll();
}

function toggleSec(name){
  const body   = document.getElementById('sec-'+name);
  const toggle = document.getElementById('toggle-'+name);
  body.classList.toggle('collapsed');
  toggle.classList.toggle('open');
}

function toggleTheme(){
  const dark = document.body.classList.toggle('dark');
  document.getElementById('theme-btn').textContent = dark ? '◑ light' : '◑ dark';
  localStorage.setItem('ira_theme', dark ? 'dark' : 'light');
}

// Init
const savedTheme = localStorage.getItem('ira_theme');
if(savedTheme === 'dark'){
  document.body.classList.add('dark');
  document.getElementById('theme-btn').textContent = '◑ light';
}

const today = new Date();
document.getElementById('f-date').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

renderAll();
</script>
</body>
</html>
