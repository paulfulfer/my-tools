<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Detail</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--bg2:#ffffff;--bg3:#efefed;--bg4:#e4e4e2;
  --border:#dddddb;--border2:#c8c8c6;
  --text:#1a1a1a;--text2:#555;--text3:#999;--text4:#bbb;
  --blue:#2a7de1;--blue-bg:#deeafa;--blue-txt:#2a7de1;
  --green:#0e9e70;--green-bg:#e0f5ec;--green-txt:#0e9e70;
  --amber:#c27d08;--amber-bg:#fdf0d5;--amber-txt:#c27d08;
  --red:#d03030;--red-bg:#fce8e8;--red-txt:#d03030;
  --purple:#6c5bbf;--purple-bg:#eae8fa;
  --r:8px;--rl:12px;
}
.dark{
  --bg:#1e1e1e;--bg2:#272727;--bg3:#2f2f2f;--bg4:#383838;
  --border:#3a3a3a;--border2:#484848;
  --text:#e2e2e2;--text2:#a0a0a0;--text3:#666;--text4:#444;
  --blue:#4a9eff;--blue-bg:#0a1e35;--blue-txt:#4a9eff;
  --green:#1fbd8a;--green-bg:#0d2e22;--green-txt:#1fbd8a;
  --amber:#e6a020;--amber-bg:#2c1f06;--amber-txt:#e6a020;
  --red:#f05050;--red-bg:#2a0f0f;--red-txt:#f05050;
  --purple:#9b87f5;--purple-bg:#1a1530;
}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:13px;line-height:1.6;padding:1.5rem 1rem;transition:background .2s,color .2s;min-height:100vh}
.container{max-width:820px;margin:0 auto}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.75rem;gap:12px}
.header-left{flex:1;min-width:0}
.page-title{font-size:17px;font-weight:600;letter-spacing:.02em;margin-bottom:2px}
.page-sub{font-size:11px;color:var(--text3)}
.header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn{font-family:inherit;font-size:11px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .15s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--bg4);color:var(--text)}
hr{border:none;border-top:1px solid var(--border);margin:1.2rem 0}
.sec-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:.5rem;display:block}
/* Info grid */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:1rem}
.info-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px}
.ic-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:3px}
.ic-val{font-size:13px;color:var(--text);font-weight:500}
.ic-input{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:500;width:100%;outline:none}
.ic-input:focus{border-bottom:1px solid var(--border2)}
/* Content sections */
.content-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:1rem}
.cb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cb-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.content-textarea{width:100%;font-family:inherit;font-size:12px;line-height:1.7;padding:0;border:none;background:transparent;color:var(--text2);resize:none;min-height:80px;outline:none}
.content-textarea:focus{border-bottom:1px solid var(--border2)}
/* Bullet list */
.bullet-wrap{display:flex;flex-direction:column;gap:4px}
.bullet-row{display:flex;align-items:flex-start;gap:7px}
.bullet-dot{color:var(--blue-txt);font-weight:700;font-size:13px;flex-shrink:0;margin-top:2px}
.bullet-input{flex:1;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--text2);font-family:inherit;font-size:12px;outline:none;padding:2px 0;line-height:1.5;transition:border-color .15s}
.bullet-input:focus{border-bottom-color:var(--border2)}
.bullet-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:13px;padding:0;font-family:inherit;transition:color .15s;flex-shrink:0;margin-top:3px}
.bullet-del:hover{color:var(--red)}
.add-bullet{background:none;border:none;color:var(--text3);font-family:inherit;font-size:11px;cursor:pointer;padding:4px 0;transition:color .15s;display:flex;align-items:center;gap:4px;margin-top:4px}
.add-bullet:hover{color:var(--blue-txt)}
/* Pay badge */
.pay-badge{display:inline-flex;align-items:center;gap:8px;background:var(--green-bg);border:1px solid var(--green);border-radius:var(--r);padding:8px 14px;margin-bottom:1rem}
.pay-label{font-size:10px;font-weight:600;color:var(--green-txt);text-transform:uppercase;letter-spacing:.08em}
.pay-input{background:transparent;border:none;color:var(--green-txt);font-family:inherit;font-size:18px;font-weight:700;width:120px;outline:none}
.pay-input:focus{border-bottom:1px solid var(--green)}
.pay-type{font-family:inherit;font-size:11px;padding:3px 7px;border-radius:5px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2)}
/* Not found */
.not-found{text-align:center;padding:3rem;color:var(--text3)}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="not-found"><p>Loading...</p></div>
</div>
<script type="module">
import { initShim, shimLocalStorage, signIn, signOutUser } from './firebase-shim.js';

shimLocalStorage();
initShim(function() {
  // ── PAGE INIT (runs after auth + data loaded) ──────────────

const params = new URLSearchParams(location.search);
const jobId  = parseInt(params.get('id'), 10);

// Load resume data
let resumeData = {sections:{exp:[]},skills:[]};
const raw = localStorage.getItem('resume_data');
if(raw){ try{ resumeData = JSON.parse(raw); }catch(e){} }

// Load or init job detail data
let jobs = JSON.parse(localStorage.getItem('job_details') || '{}');
if(!jobs[jobId]) jobs[jobId] = {payRate:'',payType:'hourly',employmentType:'',startDate:'',endDate:'',location:'',description:'',duties:[],accomplishments:[],supervisorName:'',supervisorEmail:'',notes:''};
let job = jobs[jobId];

// Find entry in resume for title/org
const expEntry = (resumeData.sections.exp||[]).find(e=>parseInt(e.id,10)===jobId);

const savedTheme = localStorage.getItem('global_theme');
if(savedTheme==='dark') document.body.classList.add('dark');

function saveJob(){
  jobs[jobId] = job;
  localStorage.setItem('job_details', JSON.stringify(jobs));
}

function g(id){ return document.getElementById(id); }

function renderPage(){
  const title = expEntry ? expEntry.title || 'Job Detail' : 'Job Detail';
  const org   = expEntry ? expEntry.org   || '' : '';
  document.title = title + ' — Job Detail';

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-left">
        <div class="page-title">${title}</div>
        <div class="page-sub">${org}</div>
      </div>
      <div class="header-actions">
        <a href="resume.html" class="btn">← resume</a>
        <button class="btn" onclick="toggleTheme()" id="theme-btn">${document.body.classList.contains('dark')?'◑ light':'◑ dark'}</button>
      </div>
    </div>

    <!-- PAY -->
    <div class="pay-badge">
      <span class="pay-label">Pay Rate</span>
      <span>$</span>
      <input class="pay-input" id="j-pay" type="text" value="${job.payRate||''}" placeholder="0.00" oninput="job.payRate=this.value;saveJob()">
      <select class="pay-type" id="j-paytype" onchange="job.payType=this.value;saveJob()">
        <option value="hourly" ${job.payType==='hourly'?'selected':''}>/ hr</option>
        <option value="salary" ${job.payType==='salary'?'selected':''}>/ yr</option>
        <option value="stipend" ${job.payType==='stipend'?'selected':''}>stipend</option>
      </select>
    </div>

    <!-- INFO GRID -->
    <div class="info-grid">
      <div class="info-card"><div class="ic-label">Employment Type</div><input class="ic-input" id="j-emptype" value="${job.employmentType||''}" placeholder="Full-time / Part-time..." oninput="job.employmentType=this.value;saveJob()"></div>
      <div class="info-card"><div class="ic-label">Start Date</div><input class="ic-input" id="j-start" value="${job.startDate||''}" placeholder="e.g. May 2025" oninput="job.startDate=this.value;saveJob()"></div>
      <div class="info-card"><div class="ic-label">End Date</div><input class="ic-input" id="j-end" value="${job.endDate||''}" placeholder="Present / Month Year" oninput="job.endDate=this.value;saveJob()"></div>
      <div class="info-card"><div class="ic-label">Location</div><input class="ic-input" id="j-loc" value="${job.location||''}" placeholder="City, State / Remote" oninput="job.location=this.value;saveJob()"></div>
      <div class="info-card"><div class="ic-label">Supervisor</div><input class="ic-input" id="j-sup" value="${job.supervisorName||''}" placeholder="Name" oninput="job.supervisorName=this.value;saveJob()"></div>
      <div class="info-card"><div class="ic-label">Supervisor Contact</div><input class="ic-input" id="j-supemail" value="${job.supervisorEmail||''}" placeholder="Email / Phone" oninput="job.supervisorEmail=this.value;saveJob()"></div>
    </div>

    <!-- JOB DESCRIPTION -->
    <div class="content-block">
      <div class="cb-header"><span class="cb-title">Job Description</span></div>
      <textarea class="content-textarea" id="j-desc" placeholder="Paste the full job description here..." oninput="job.description=this.value;saveJob();autoResize(this)">${job.description||''}</textarea>
    </div>

    <!-- DUTIES -->
    <div class="content-block">
      <div class="cb-header"><span class="cb-title">Duties & Responsibilities</span></div>
      <div class="bullet-wrap" id="duties-list"></div>
      <button class="add-bullet" onclick="addBullet('duties')"><span style="font-size:14px;font-weight:300">+</span> Add duty</button>
    </div>

    <!-- ACCOMPLISHMENTS -->
    <div class="content-block">
      <div class="cb-header"><span class="cb-title">Key Accomplishments</span></div>
      <div class="bullet-wrap" id="accomplishments-list"></div>
      <button class="add-bullet" onclick="addBullet('accomplishments')"><span style="font-size:14px;font-weight:300">+</span> Add accomplishment</button>
    </div>

    <!-- NOTES -->
    <div class="content-block">
      <div class="cb-header"><span class="cb-title">Notes</span></div>
      <textarea class="content-textarea" id="j-notes" placeholder="Anything else worth remembering about this role..." oninput="job.notes=this.value;saveJob();autoResize(this)">${job.notes||''}</textarea>
    </div>
  `;

  renderBullets('duties');
  renderBullets('accomplishments');
  ['j-desc','j-notes'].forEach(id=>{ const el=g(id); if(el) autoResize(el); });
}

function autoResize(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

function renderBullets(field){
  const el = g(field+'-list');
  if(!el) return;
  job[field] = job[field]||[];
  el.innerHTML = job[field].map((b,i)=>`
    <div class="bullet-row">
      <span class="bullet-dot">·</span>
      <input class="bullet-input" value="${escHtml(b)}" placeholder="Enter detail..."
        oninput="job['${field}'][${i}]=this.value;saveJob()" onblur="saveJob()">
      <button class="bullet-del" onclick="removeBullet('${field}',${i})">✕</button>
    </div>
  `).join('');
}

function addBullet(field){
  job[field]=job[field]||[];
  job[field].push('');
  saveJob();renderBullets(field);
  const inputs=g(field+'-list').querySelectorAll('.bullet-input');
  if(inputs.length) inputs[inputs.length-1].focus();
}

function removeBullet(field,idx){
  job[field].splice(idx,1);saveJob();renderBullets(field);
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleTheme(){
  const dark=document.body.classList.toggle('dark');
  g('theme-btn').textContent=dark?'◑ light':'◑ dark';
  localStorage.setItem('global_theme',dark?'dark':'light');
}

if(isNaN(jobId)){
  document.getElementById('app').innerHTML='<div class="not-found"><p>No job ID provided.</p><br><a href="resume.html" class="btn">← Back to Resume</a></div>';
} else {
  renderPage();
}


// ── EXPOSE TO GLOBAL SCOPE ──
window.addBullet = addBullet;
window.autoResize = autoResize;
window.removeBullet = removeBullet;
window.toggleTheme = toggleTheme;
}); // end initShim
</script>
</body>
</html>
