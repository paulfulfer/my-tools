<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2020"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#00b37e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Flag pole -->
  <line x1="256" y1="96" x2="256" y2="400" stroke="#22d3ee" stroke-width="14" stroke-linecap="round"/>
  <!-- Flag -->
  <polygon points="256,96 368,152 256,208" fill="url(#fg)"/>
  <!-- Golf ball -->
  <circle cx="256" cy="420" r="44" fill="none" stroke="url(#fg)" stroke-width="12"/>
  <circle cx="256" cy="420" r="8" fill="#0891b2"/>
  <!-- Ground line -->
  <line x1="160" y1="464" x2="352" y2="464" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
</svg>
