<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2818"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b37e"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Upward trend bars -->
  <rect x="96" y="320" width="64" height="112" rx="10" fill="url(#fg)" opacity="0.5"/>
  <rect x="192" y="256" width="64" height="176" rx="10" fill="url(#fg)" opacity="0.7"/>
  <rect x="288" y="192" width="64" height="240" rx="10" fill="url(#fg)" opacity="0.85"/>
  <rect x="384" y="112" width="64" height="320" rx="10" fill="url(#fg)"/>
  <!-- Trend line -->
  <polyline points="128,304 224,240 320,176 416,96" 
    stroke="url(#fg)" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dot at top -->
  <circle cx="416" cy="96" r="18" fill="#22d3ee"/>
</svg>
