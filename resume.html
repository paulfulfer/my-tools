<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var t=localStorage.getItem('global_theme');
    if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="./global_theme.css">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul — Resume</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}


body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:13px;line-height:1.6;padding:1.5rem 1rem;min-height:100vh;transition:background .2s,color .2s}
.container{max-width:860px;margin:0 auto}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;gap:12px}
.page-header-left{flex:1}
.page-title{font-size:17px;font-weight:600;letter-spacing:.02em;margin-bottom:2px}
.page-sub{font-size:11px;color:var(--text3);letter-spacing:.03em}
.header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn{font-family:inherit;font-size:11px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .15s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--bg4);color:var(--text)}
.btn-blue{background:var(--blue-dim);color:var(--blue-txt);border-color:var(--blue)}
.btn-blue:hover{opacity:.85}
.profile-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:22px 24px;margin-bottom:1.5rem}
.profile-name input{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:22px;font-weight:700;letter-spacing:-.01em;width:100%;outline:none;margin-bottom:4px}
.profile-name input:focus{border-bottom:1px solid var(--border2)}
.profile-headline input{background:transparent;border:none;color:var(--text2);font-family:inherit;font-size:13px;width:100%;outline:none;margin-bottom:8px}
.profile-headline input:focus{border-bottom:1px solid var(--border2)}
.profile-meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.pm-field{display:flex;align-items:center;gap:5px}
.pm-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pm-field input{background:transparent;border:none;color:var(--text2);font-family:inherit;font-size:11px;outline:none;min-width:130px}
.pm-field input:focus{border-bottom:1px solid var(--border2)}
.profile-about textarea{background:transparent;border:none;color:var(--text2);font-family:inherit;font-size:12px;line-height:1.65;width:100%;outline:none;resize:none;min-height:48px}
.profile-about textarea:focus{border-bottom:1px solid var(--border2)}
.resume-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px 22px;margin-bottom:1rem}
.rs-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.rs-title{font-size:13px;font-weight:700;color:var(--text);letter-spacing:.04em;text-transform:uppercase}
.rs-add{background:none;border:1px solid var(--border2);color:var(--text3);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;line-height:1;flex-shrink:0}
.rs-add:hover{background:var(--blue-dim);color:var(--blue-txt);border-color:var(--blue)}
.entry-item{padding:12px 0;border-bottom:1px solid var(--border)}
.entry-item:last-child{border-bottom:none;padding-bottom:0}
.entry-item:first-child{padding-top:0}
.entry-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.entry-title input,.entry-org input,.entry-date input,.entry-loc input{background:transparent;border:none;color:inherit;font-family:inherit;outline:none;width:100%}
.entry-title input{font-size:13px;font-weight:600;color:var(--text)}
.entry-title input:focus,.entry-org input:focus,.entry-date input:focus,.entry-loc input:focus{border-bottom:1px solid var(--border2)}
.entry-org input{font-size:12px;color:var(--blue-txt);font-weight:500}
.entry-date input{font-size:11px;color:var(--text3)}
.entry-loc input{font-size:11px;color:var(--text3)}
.entry-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.entry-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:14px;padding:0;font-family:inherit;transition:color .15s;flex-shrink:0}
.entry-del:hover{color:var(--red)}
.tags-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.skill-tag{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:3px 12px;font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px}
.skill-tag .tag-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:12px;padding:0;line-height:1;transition:color .15s}
.skill-tag .tag-del:hover{color:var(--red)}
.tag-add-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.tag-add-row input{flex:1;font-family:inherit;font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);outline:none;transition:border-color .15s}
.tag-add-row input:focus{border-color:var(--blue)}
.tag-add-btn{font-family:inherit;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s}
.tag-add-btn:hover{background:var(--blue-dim);color:var(--blue-txt);border-color:var(--blue)}
.bullet-input-wrap{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.bullet-dot{color:var(--blue-txt);font-weight:700;font-size:13px;flex-shrink:0}
.bullet-input{flex:1;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--text2);font-family:inherit;font-size:12px;outline:none;padding:2px 0;transition:border-color .15s}
.bullet-input:focus{border-bottom-color:var(--border2)}
.bullet-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:13px;padding:0 2px;font-family:inherit;transition:color .15s;flex-shrink:0}
.bullet-del:hover{color:var(--red)}
.add-bullet-btn{background:none;border:none;color:var(--text3);font-family:inherit;font-size:11px;cursor:pointer;padding:3px 0;transition:color .15s;display:flex;align-items:center;gap:4px}
.add-bullet-btn:hover{color:var(--blue-txt)}
.sec-exp{border-left:3px solid var(--blue)}
.sec-edu{border-left:3px solid var(--green)}
.sec-lic{border-left:3px solid var(--amber)}
.sec-skills{border-left:3px solid var(--purple)}
.sec-honors{border-left:3px solid var(--amber)}
.sec-vol{border-left:3px solid var(--green)}
.sec-projects{border-left:3px solid var(--blue)}
.empty-hint{color:var(--text4);font-size:11px;font-style:italic}
/* View / job link */
.entry-job-link{font-size:10px;font-weight:600;color:var(--blue-txt);text-decoration:none;padding:2px 9px;border-radius:10px;background:var(--blue-bg);border:1px solid var(--blue);margin-left:6px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;transition:opacity .15s}
.entry-job-link:hover{opacity:.75}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;color:#000!important;padding:.4in .5in;font-size:11px}
  .page-header,.btn,.rs-add,.entry-del,.tag-del,.add-bullet-btn,.bullet-del,.tag-add-row,.entry-job-link{display:none!important}
  .container{max-width:100%}
  .profile-block,.resume-section{background:#fff!important;border:none!important;border-radius:0!important;padding:8px 0!important;margin-bottom:10px!important;box-shadow:none!important}
  .profile-block{border-bottom:2px solid #000!important;padding-bottom:10px!important}
  .resume-section{border-left:none!important;border-top:1px solid #ccc!important}
  .rs-header{border-bottom:1px solid #ccc!important;padding-bottom:4px!important}
  .rs-title{color:#000!important;font-size:11px!important}
  .profile-name input{color:#000!important;font-size:18px!important}
  .profile-headline input,.entry-org input{color:#222!important}
  .entry-title input{color:#000!important}
  .entry-date input,.entry-loc input{color:#444!important}
  .bullet-input{color:#222!important}
  .skill-tag{background:#f0f0f0!important;border:1px solid #ccc!important;color:#000!important}
  .entry-item{border-bottom:1px solid #eee!important}
  .resume-section{page-break-inside:avoid}
  textarea,input{pointer-events:none}
}
</style>

</head>
<body>
<div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
<div class="container">

<div class="page-header">
  <div class="page-header-left">
    <div class="page-title">Paul's Resume</div>
    <div class="page-sub">edit inline · all changes saved automatically</div>
  </div>
  <div class="header-actions">
    <a href="index.html" class="btn">← home</a>
    <button class="btn" onclick="toggleTheme()" id="theme-btn">◑ dark</button>
    <button class="btn btn-blue" onclick="window.print()">Export PDF</button>
  </div>
</div>

<!-- PROFILE -->
<div class="profile-block">
  <div class="profile-name"><input id="p-name" placeholder="Your Name" oninput="save()"></div>
  <div class="profile-headline"><input id="p-headline" placeholder="Headline — e.g. Student · Resident Assistant · Finance & Operations" oninput="save()"></div>
  <div class="profile-meta">
    <div class="pm-field"><span class="pm-label">Location</span><input id="p-location" placeholder="City, State" oninput="save()"></div>
    <div class="pm-field"><span class="pm-label">Email</span><input id="p-email" placeholder="email@example.com" oninput="save()"></div>
    <div class="pm-field"><span class="pm-label">Phone</span><input id="p-phone" placeholder="(555) 000-0000" oninput="save()"></div>
    <div class="pm-field"><span class="pm-label">LinkedIn</span><input id="p-linkedin" placeholder="linkedin.com/in/yourname" oninput="save()"></div>
  </div>
  <div class="profile-about"><textarea id="p-about" placeholder="Summary — write a short professional bio..." rows="3" oninput="autoResize(this);save()"></textarea></div>
</div>

<!-- EXPERIENCE -->
<div class="resume-section sec-exp">
  <div class="rs-header"><span class="rs-title">Experience</span><button class="rs-add" onclick="addEntry('exp')">+</button></div>
  <div id="exp-list"></div>
</div>

<!-- EDUCATION -->
<div class="resume-section sec-edu">
  <div class="rs-header"><span class="rs-title">Education</span><button class="rs-add" onclick="addEntry('edu')">+</button></div>
  <div id="edu-list"></div>
</div>

<!-- LICENSES -->
<div class="resume-section sec-lic">
  <div class="rs-header"><span class="rs-title">Licenses & Certifications</span><button class="rs-add" onclick="addEntry('lic')">+</button></div>
  <div id="lic-list"></div>
</div>

<!-- SKILLS -->
<div class="resume-section sec-skills">
  <div class="rs-header"><span class="rs-title">Skills</span><button class="rs-add" onclick="addSkill()">+</button></div>
  <div id="skills-tags"></div>
  <div class="tag-add-row" id="skills-add-row" style="display:none">
    <input id="skill-input" placeholder="Add a skill..." onkeydown="if(event.key==='Enter')commitSkill()">
    <button class="tag-add-btn" onclick="commitSkill()">Add</button>
  </div>
</div>

<!-- HONORS -->
<div class="resume-section sec-honors">
  <div class="rs-header"><span class="rs-title">Honors & Awards</span><button class="rs-add" onclick="addEntry('honors')">+</button></div>
  <div id="honors-list"></div>
</div>

<!-- VOLUNTEER -->
<div class="resume-section sec-vol">
  <div class="rs-header"><span class="rs-title">Volunteer & Leadership</span><button class="rs-add" onclick="addEntry('vol')">+</button></div>
  <div id="vol-list"></div>
</div>

<!-- PROJECTS -->
<div class="resume-section sec-projects">
  <div class="rs-header"><span class="rs-title">Projects</span><button class="rs-add" onclick="addEntry('projects')">+</button></div>
  <div id="projects-list"></div>
</div>

</div>
<script type="module">
import { initShim, shimLocalStorage, signIn, signOutUser } from './firebase-shim.js';

shimLocalStorage();
initShim(function() {
  // ── PAGE INIT (runs after auth + data loaded) ──────────────

const SECTIONS=['exp','edu','lic','honors','vol','projects'];
const CFG={
  exp:     {t:'Job Title',o:'Company / Organization',d:'e.g. May 2025 – Present',l:'Location',bullets:true,jobLink:true},
  edu:     {t:'Degree / Program',o:'Institution',d:'e.g. Aug 2022 – May 2026',l:'Location',bullets:true,jobLink:false},
  lic:     {t:'License / Certification',o:'Issuing Organization',d:'Issued / Expires',l:'Credential ID',bullets:false,jobLink:false},
  honors:  {t:'Award / Honor',o:'Issuing Organization',d:'Year',l:'',bullets:false,jobLink:false},
  vol:     {t:'Role',o:'Organization',d:'Date Range',l:'Location',bullets:true,jobLink:false},
  projects:{t:'Project Name',o:'Organization / Context',d:'Date',l:'',bullets:true,jobLink:false},
};

let data={profile:{name:'',headline:'',location:'',email:'',phone:'',linkedin:'',about:''},sections:{exp:[],edu:[],lic:[],honors:[],vol:[],projects:[]},skills:[]};
let idC=parseInt(localStorage.getItem('resume_id')||'1',10)||1;

function save(){
  data.profile={name:g('p-name').value,headline:g('p-headline').value,location:g('p-location').value,email:g('p-email').value,phone:g('p-phone').value,linkedin:g('p-linkedin').value,about:g('p-about').value};
  localStorage.setItem('resume_data',JSON.stringify(data));
  localStorage.setItem('resume_id',idC);
}
function load(){
  const r=localStorage.getItem('resume_data');
  if(r){try{data=JSON.parse(r);}catch(e){}}
  idC=parseInt(localStorage.getItem('resume_id')||'1',10)||1;
}
function g(id){return document.getElementById(id);}
function autoResize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function initProfile(){
  const p=data.profile;
  ['name','headline','location','email','phone','linkedin'].forEach(k=>{g('p-'+k).value=p[k]||'';});
  g('p-about').value=p.about||'';autoResize(g('p-about'));
}

// ── ENTRIES ────────────────────────────────────────────
function addEntry(sec){
  data.sections[sec].push({id:idC++,title:'',org:'',date:'',loc:'',bullets:[]});
  save();renderSection(sec);
}
function removeEntry(sec,id){
  data.sections[sec]=data.sections[sec].filter(e=>e.id!==id);
  save();renderSection(sec);
}
function updateEntry(sec,id,field,val){
  const e=data.sections[sec].find(x=>x.id===id);
  if(e){e[field]=val;save();}
}
function addBullet(sec,id){
  const e=data.sections[sec].find(x=>x.id===id);
  if(e){e.bullets=e.bullets||[];e.bullets.push('');save();renderSection(sec);}
}
function updateBullet(sec,id,idx,val){
  const e=data.sections[sec].find(x=>x.id===id);
  if(e&&e.bullets){e.bullets[idx]=val;save();}
}
function removeBullet(sec,id,idx){
  const e=data.sections[sec].find(x=>x.id===id);
  if(e&&e.bullets){e.bullets.splice(idx,1);save();renderSection(sec);}
}

function renderSection(sec){
  const cfg=CFG[sec];
  const list=g(sec+'-list');
  list.innerHTML='';
  if(!data.sections[sec]||data.sections[sec].length===0){
    list.innerHTML='<div class="empty-hint">No entries yet. Click + to add.</div>';return;
  }
  data.sections[sec].forEach(e=>{
    const div=document.createElement('div');
    div.className='entry-item';
    const bulletsHtml=cfg.bullets?`
      <div style="margin-top:6px">
        ${(e.bullets||[]).map((b,i)=>`
          <div class="bullet-input-wrap">
            <span class="bullet-dot">·</span>
            <input class="bullet-input" value="${esc(b)}" placeholder="Bullet point..."
              oninput="updateBullet('${sec}',${e.id},${i},this.value)" onblur="save()">
            <button class="bullet-del" onclick="removeBullet('${sec}',${e.id},${i})">✕</button>
          </div>`).join('')}
        <button class="add-bullet-btn" onclick="addBullet('${sec}',${e.id})"><span style="font-size:14px;font-weight:300">+</span> Add bullet</button>
      </div>`:'';
    const jobLinkHtml=cfg.jobLink&&e.id?`<a class="entry-job-link" href="job.html?id=${e.id}" target="_blank">View Job</a>`:'';
    div.innerHTML=`
      <div class="entry-header">
        <div style="flex:1;min-width:0">
          <div class="entry-title" style="display:flex;align-items:center;gap:6px">
            <input value="${esc(e.title)}" placeholder="${cfg.t}" oninput="updateEntry('${sec}',${e.id},'title',this.value)" onblur="save()">
            ${jobLinkHtml}
          </div>
          <div class="entry-meta">
            <div class="entry-org"><input value="${esc(e.org)}" placeholder="${cfg.o}" oninput="updateEntry('${sec}',${e.id},'org',this.value)" onblur="save()"></div>
            <div class="entry-date"><input value="${esc(e.date)}" placeholder="${cfg.d}" oninput="updateEntry('${sec}',${e.id},'date',this.value)" onblur="save()"></div>
            ${cfg.l?`<div class="entry-loc"><input value="${esc(e.loc||'')}" placeholder="${cfg.l}" oninput="updateEntry('${sec}',${e.id},'loc',this.value)" onblur="save()"></div>`:''}
          </div>
        </div>
        <button class="entry-del" onclick="removeEntry('${sec}',${e.id})">✕</button>
      </div>
      ${bulletsHtml}`;
    list.appendChild(div);
  });
}

function renderAll(){SECTIONS.forEach(s=>renderSection(s));renderSkills();}

// ── SKILLS ────────────────────────────────────────────
function addSkill(){
  const row=g('skills-add-row');
  row.style.display=row.style.display==='none'?'flex':'none';
  if(row.style.display==='flex') g('skill-input').focus();
}
function commitSkill(){
  const input=g('skill-input');const val=input.value.trim();
  if(!val)return;
  data.skills.push(val);input.value='';
  g('skills-add-row').style.display='none';save();renderSkills();
}
function removeSkill(idx){data.skills.splice(idx,1);save();renderSkills();}
function renderSkills(){
  const wrap=g('skills-tags');
  if(!data.skills||data.skills.length===0){wrap.innerHTML='<div class="empty-hint">No skills yet. Click + to add.</div>';return;}
  wrap.innerHTML='<div class="tags-wrap">'+data.skills.map((s,i)=>`
    <div class="skill-tag"><span>${esc(s)}</span><button class="tag-del" onclick="removeSkill(${i})">✕</button></div>`).join('')+'</div>';
}

// ── THEME ─────────────────────────────────────────────
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = isDark ? '◑ dark' : '◑ light';
  try{ localStorage.setItem('global_theme', isDark ? 'light' : 'dark'); }catch(e){}
}

// ── INIT ──────────────────────────────────────────────
load();
// Apply theme
(function(){
  const t = localStorage.getItem('global_theme');
  document.documentElement.setAttribute('data-theme', t==='dark' ? 'dark' : 'light');
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = t==='dark' ? '◑ light' : '◑ dark';
})();
initProfile();renderAll();

// Pre-fill if empty
if(data.sections.exp.length===0&&!data.profile.name){
  data.profile.name='Paul';
  data.profile.location='Elizabethtown, PA';
  const roles=[
    {id:idC++,title:'Resident Assistant',org:'Elizabethtown College — SESP',date:'Aug 2025 – Present',loc:'Elizabethtown, PA',bullets:['Managed residential community providing support and crisis response.','Facilitated programming and community-building events for residents.']},
    {id:idC++,title:'Teaching Assistant — H201',org:'Elizabethtown College',date:'Spring 2026',loc:'Elizabethtown, PA',bullets:['Supported Prof. Benowitz\'s History course with student research guidance.','Built a multi-step property research guide for Marietta, PA historic properties.']},
    {id:idC++,title:'Entertainment Supervisor',org:'Hersheypark / Hershey Entertainment & Resorts',date:'Summer 2026',loc:'Hershey, PA',bullets:['']},
  ];
  data.sections.exp=roles;
  data.sections.edu=[{id:idC++,title:'Bachelor of Arts',org:'Elizabethtown College',date:'Aug 2022 – May 2026',loc:'Elizabethtown, PA',bullets:['Honors Program','Resident Assistant']}];
  save();initProfile();renderAll();
}


// ── EXPOSE TO GLOBAL SCOPE (required for inline onclick handlers in ES modules) ──
window.addBullet = addBullet;
window.addEntry = addEntry;
window.addSkill = addSkill;
window.autoResize = autoResize;
window.commitSkill = commitSkill;
window.removeBullet = removeBullet;
window.removeEntry = removeEntry;
window.removeSkill = removeSkill;
window.save = save;
window.toggleTheme = toggleTheme;
window.updateBullet = updateBullet;
window.updateEntry = updateEntry;
}); // end initShim

// Register service worker for PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
