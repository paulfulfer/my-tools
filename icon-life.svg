<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#150d28"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Hexagon -->
  <polygon points="256,80 384,156 384,308 256,384 128,308 128,156" 
    fill="none" stroke="url(#fg)" stroke-width="18" stroke-linejoin="round"/>
  <!-- Inner hexagon smaller -->
  <polygon points="256,148 330,190 330,274 256,316 182,274 182,190" 
    fill="url(#fg)" opacity="0.18"/>
  <!-- Center dot -->
  <circle cx="256" cy="232" r="36" fill="url(#fg)"/>
  <!-- Connecting lines from center -->
  <line x1="256" y1="196" x2="256" y2="148" stroke="url(#fg)" stroke-width="8" opacity="0.5"/>
  <line x1="256" y1="268" x2="256" y2="316" stroke="url(#fg)" stroke-width="8" opacity="0.5"/>
  <line x1="225" y1="214" x2="182" y2="190" stroke="url(#fg)" stroke-width="8" opacity="0.5"/>
  <line x1="287" y1="214" x2="330" y2="190" stroke="url(#fg)" stroke-width="8" opacity="0.5"/>
</svg>
