<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Log</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--bg2:#ffffff;--bg3:#efefed;--bg4:#e4e4e2;
  --border:#dddddб;--border2:#c8c8c6;
  --text:#1a1a1a;--text2:#555;--text3:#999;--text4:#bbb;
  --green:#0e9e70;--green-bg:#e0f5ec;--green-txt:#0e9e70;
  --amber:#c27d08;--amber-bg:#fdf0d5;--amber-txt:#c27d08;
  --blue:#2a7de1;--blue-bg:#deeafa;--blue-txt:#2a7de1;
  --red:#d03030;--red-bg:#fce8e8;--red-txt:#d03030;
  --purple:#6c5bbf;--purple-bg:#eae8fa;
  --r:8px;--rl:12px;
}
.dark{
  --bg:#1e1e1e;--bg2:#272727;--bg3:#2f2f2f;--bg4:#383838;
  --border:#3a3a3a;--border2:#484848;
  --text:#e2e2e2;--text2:#a0a0a0;--text3:#666;--text4:#444;
  --green:#1fbd8a;--green-bg:#0d2e22;--green-txt:#1fbd8a;
  --amber:#e6a020;--amber-bg:#2c1f06;--amber-txt:#e6a020;
  --blue:#4a9eff;--blue-bg:#0a1e35;--blue-txt:#4a9eff;
  --red:#f05050;--red-bg:#2a0f0f;--red-txt:#f05050;
  --purple:#9b87f5;--purple-bg:#1a1530;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'SF Mono','Fira Code','Cascadia Code',monospace;
  font-size:13px;line-height:1.6;
  padding:1.5rem 1rem;
  transition:background .2s,color .2s;
  min-height:100vh;
}
.container{max-width:820px;margin:0 auto}

.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.75rem}
.page-title{font-size:17px;font-weight:600;letter-spacing:.02em;margin-bottom:2px}
.page-sub{font-size:11px;color:var(--text3);letter-spacing:.03em}
.header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn{font-family:inherit;font-size:11px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .15s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--bg4);color:var(--text)}
.btn-primary{background:var(--blue-bg);color:var(--blue-txt);border-color:var(--blue)}
.btn-primary:hover{opacity:.85}
.btn-green{background:var(--green-bg);color:var(--green-txt);border-color:var(--green)}
.btn-green:hover{opacity:.85}

.sec-header{display:flex;align-items:center;justify-content:space-between;margin:1.6rem 0 .55rem;padding-bottom:5px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.sec-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.12em}
.sec-toggle{font-size:14px;color:var(--text3);transition:transform .2s;line-height:1}
.sec-toggle.open{transform:rotate(180deg)}
.sec-body.collapsed{display:none}

hr{border:none;border-top:1px solid var(--border);margin:1.4rem 0}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:.5rem 0 1rem}
.met{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.met-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.met-val{font-size:19px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.met-val.green{color:var(--green)}
.met-val.blue{color:var(--blue)}
.met-val.amber{color:var(--amber)}
.met-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* Entry form */
.entry-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:1rem}
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.form-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:120px}
.form-group.narrow{flex:0 0 auto;min-width:90px}
.form-group label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.form-group input,.form-group select,.form-group textarea{
  font-family:inherit;font-size:12px;
  padding:5px 9px;border-radius:6px;
  border:1px solid var(--border2);
  background:var(--bg3);color:var(--text);
  transition:border-color .15s;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  outline:none;border-color:var(--blue);
}
.form-group textarea{resize:vertical;min-height:38px;line-height:1.4}
.form-actions{display:flex;justify-content:flex-end;margin-top:4px}

/* Shift list */
.shift-list{display:flex;flex-direction:column;gap:6px}
.shift-item{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 14px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
}
.shift-item:hover{border-color:var(--border2)}
.si-left{flex:1;min-width:0}
.si-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.si-job{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.si-date{font-size:11px;color:var(--text3)}
.si-times{font-size:12px;color:var(--text2)}
.si-note{font-size:11px;color:var(--text3);margin-top:2px;font-style:italic}
.si-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.si-hours{font-size:13px;font-weight:600;color:var(--text)}
.si-gross{font-size:12px;font-weight:600;color:var(--green)}
.si-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:14px;padding:0;line-height:1;font-family:inherit;transition:color .15s}
.si-del:hover{color:var(--red)}

.empty-state{text-align:center;padding:2rem;color:var(--text3);font-size:12px;border:1px dashed var(--border2);border-radius:var(--r)}

/* Job color tags */
.job-sesp{color:#2a7de1}
.job-honors{color:#6c5bbf}
.job-intern{color:#0e9e70}
.job-ra{color:#c27d08}

/* Settings */
.wages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.wage-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px}
.wage-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.wage-input-row{display:flex;align-items:center;gap:4px}
.wage-prefix{font-size:12px;color:var(--text3)}
.wage-input-row input{
  flex:1;font-family:inherit;font-size:13px;font-weight:600;
  padding:4px 7px;border-radius:6px;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text);
  text-align:right;
}
.wage-input-row input:focus{outline:none;border-color:var(--blue)}

.pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.pill-g{background:var(--green-bg);color:var(--green-txt)}
.pill-a{background:var(--amber-bg);color:var(--amber-txt)}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="page-title">Paul's Shift Log</div>
      <div class="page-sub">hours & earnings tracker · 2026</div>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn">← home</a>
      <button class="btn" onclick="toggleTheme()" id="theme-btn">◑ dark</button>
    </div>
  </div>

  <!-- Summary metrics -->
  <div class="pgrid" id="metrics-grid">
    <div class="met">
      <div class="met-label">Total Hours</div>
      <div class="met-val blue" id="met-hours">0.0</div>
      <div class="met-sub">all jobs</div>
    </div>
    <div class="met">
      <div class="met-label">Total Gross</div>
      <div class="met-val green" id="met-gross">$0.00</div>
      <div class="met-sub">before tax</div>
    </div>
    <div class="met">
      <div class="met-label">Shifts Logged</div>
      <div class="met-val" id="met-shifts">0</div>
      <div class="met-sub">all time</div>
    </div>
    <div class="met">
      <div class="met-label">This Week</div>
      <div class="met-val amber" id="met-week">$0.00</div>
      <div class="met-sub">gross earnings</div>
    </div>
  </div>

  <!-- Per-job breakdown -->
  <div class="sec-header" onclick="toggleSec('breakdown')">
    <span class="sec-label">Per-Job Breakdown</span>
    <span class="sec-toggle open" id="toggle-breakdown">▼</span>
  </div>
  <div class="sec-body" id="sec-breakdown">
    <div class="pgrid" id="job-breakdown"></div>
  </div>

  <!-- Log entry -->
  <div class="sec-header" onclick="toggleSec('entry')">
    <span class="sec-label">Log a Shift</span>
    <span class="sec-toggle open" id="toggle-entry">▼</span>
  </div>
  <div class="sec-body" id="sec-entry">
    <div class="entry-card">
      <div class="form-row">
        <div class="form-group">
          <label>Job</label>
          <select id="f-job">
            <option value="SESP">SESP</option>
            <option value="Honors Center">Honors Center</option>
            <option value="Internship">Internship</option>
            <option value="RA">RA</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="f-date">
        </div>
        <div class="form-group narrow">
          <label>Clock In</label>
          <input type="time" id="f-in">
        </div>
        <div class="form-group narrow">
          <label>Clock Out</label>
          <input type="time" id="f-out">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Note (optional)</label>
          <textarea id="f-note" placeholder="e.g. desk coverage, event setup..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-green" onclick="logShift()">+ Log Shift</button>
      </div>
    </div>
  </div>

  <!-- Shift history -->
  <div class="sec-header" onclick="toggleSec('history')">
    <span class="sec-label">Shift History</span>
    <span class="sec-toggle open" id="toggle-history">▼</span>
  </div>
  <div class="sec-body" id="sec-history">
    <div class="shift-list" id="shift-list"></div>
  </div>

  <hr>

  <!-- Wage settings -->
  <div class="sec-header" onclick="toggleSec('wages')">
    <span class="sec-label">Hourly Wages</span>
    <span class="sec-toggle" id="toggle-wages">▼</span>
  </div>
  <div class="sec-body collapsed" id="sec-wages">
    <div class="wages-grid">
      <div class="wage-card">
        <div class="wage-label job-sesp">SESP</div>
        <div class="wage-input-row"><span class="wage-prefix">$</span><input type="number" id="wage-SESP" step="0.01" min="0" placeholder="0.00" oninput="saveWages();renderAll()"></div>
      </div>
      <div class="wage-card">
        <div class="wage-label job-honors">Honors Center</div>
        <div class="wage-input-row"><span class="wage-prefix">$</span><input type="number" id="wage-Honors Center" step="0.01" min="0" placeholder="0.00" oninput="saveWages();renderAll()"></div>
      </div>
      <div class="wage-card">
        <div class="wage-label job-intern">Internship</div>
        <div class="wage-input-row"><span class="wage-prefix">$</span><input type="number" id="wage-Internship" step="0.01" min="0" placeholder="0.00" oninput="saveWages();renderAll()"></div>
      </div>
      <div class="wage-card">
        <div class="wage-label job-ra">RA</div>
        <div class="wage-input-row"><span class="wage-prefix">$</span><input type="number" id="wage-RA" step="0.01" min="0" placeholder="0.00" oninput="saveWages();renderAll()"></div>
      </div>
    </div>
  </div>

</div>

<script>
const JOBS = ['SESP','Honors Center','Internship','RA'];
const JOB_COLORS = {'SESP':'job-sesp','Honors Center':'job-honors','Internship':'job-intern','RA':'job-ra'};

let shifts = JSON.parse(localStorage.getItem('shiftlog_shifts') || '[]');
let wages  = JSON.parse(localStorage.getItem('shiftlog_wages')  || '{}');

function saveWages(){
  JOBS.forEach(j => {
    const el = document.getElementById('wage-'+j);
    if(el) wages[j] = parseFloat(el.value) || 0;
  });
  localStorage.setItem('shiftlog_wages', JSON.stringify(wages));
}
function loadWages(){
  JOBS.forEach(j => {
    const el = document.getElementById('wage-'+j);
    if(el && wages[j]) el.value = wages[j];
  });
}

function parseHours(inT, outT){
  if(!inT || !outT) return 0;
  const [ih,im] = inT.split(':').map(Number);
  const [oh,om] = outT.split(':').map(Number);
  let mins = (oh*60+om) - (ih*60+im);
  if(mins < 0) mins += 24*60;
  return Math.round(mins/60*100)/100;
}

function fmt$(n){ return '$'+n.toFixed(2); }
function fmtH(n){ return n.toFixed(1)+'h'; }

function logShift(){
  const job   = document.getElementById('f-job').value;
  const date  = document.getElementById('f-date').value;
  const inT   = document.getElementById('f-in').value;
  const outT  = document.getElementById('f-out').value;
  const note  = document.getElementById('f-note').value.trim();

  if(!date || !inT || !outT){ alert('Please fill in date, clock-in, and clock-out.'); return; }

  const hours = parseHours(inT, outT);
  if(hours <= 0){ alert('Clock-out must be after clock-in.'); return; }

  shifts.unshift({ id: Date.now(), job, date, inT, outT, note, hours });
  localStorage.setItem('shiftlog_shifts', JSON.stringify(shifts));

  document.getElementById('f-note').value = '';
  document.getElementById('f-in').value = '';
  document.getElementById('f-out').value = '';

  renderAll();
}

function deleteShift(id){
  shifts = shifts.filter(s => s.id !== id);
  localStorage.setItem('shiftlog_shifts', JSON.stringify(shifts));
  renderAll();
}

function getWeekGross(){
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
  monday.setHours(0,0,0,0);
  return shifts
    .filter(s => new Date(s.date + 'T00:00:00') >= monday)
    .reduce((sum,s) => sum + s.hours * (wages[s.job] || 0), 0);
}

function renderAll(){
  // Metrics
  const totalHours = shifts.reduce((s,x) => s + x.hours, 0);
  const totalGross = shifts.reduce((s,x) => s + x.hours * (wages[x.job]||0), 0);
  document.getElementById('met-hours').textContent  = totalHours.toFixed(1);
  document.getElementById('met-gross').textContent  = fmt$(totalGross);
  document.getElementById('met-shifts').textContent = shifts.length;
  document.getElementById('met-week').textContent   = fmt$(getWeekGross());

  // Per-job breakdown
  const bd = document.getElementById('job-breakdown');
  bd.innerHTML = '';
  JOBS.forEach(j => {
    const jShifts = shifts.filter(s => s.job === j);
    const jHours  = jShifts.reduce((s,x) => s + x.hours, 0);
    const jGross  = jHours * (wages[j] || 0);
    const div = document.createElement('div');
    div.className = 'met';
    div.innerHTML = `
      <div class="met-label ${JOB_COLORS[j]}">${j}</div>
      <div class="met-val">${jHours.toFixed(1)}h</div>
      <div class="met-sub">${fmt$(jGross)} gross</div>
    `;
    bd.appendChild(div);
  });

  // Shift list
  const list = document.getElementById('shift-list');
  if(shifts.length === 0){
    list.innerHTML = '<div class="empty-state">No shifts logged yet. Clock in above.</div>';
    return;
  }
  list.innerHTML = '';
  shifts.forEach(s => {
    const gross = s.hours * (wages[s.job] || 0);
    const fmtDate = new Date(s.date + 'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    const div = document.createElement('div');
    div.className = 'shift-item';
    div.innerHTML = `
      <div class="si-left">
        <div class="si-top">
          <span class="si-job ${JOB_COLORS[s.job]}">${s.job}</span>
          <span class="si-date">${fmtDate}</span>
        </div>
        <div class="si-times">${s.inT} → ${s.outT}</div>
        ${s.note ? `<div class="si-note">${s.note}</div>` : ''}
      </div>
      <div class="si-right">
        <span class="si-hours">${fmtH(s.hours)}</span>
        <span class="si-gross">${fmt$(gross)}</span>
        <button class="si-del" onclick="deleteShift(${s.id})" title="Delete">✕</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function toggleSec(name){
  const body   = document.getElementById('sec-'+name);
  const toggle = document.getElementById('toggle-'+name);
  body.classList.toggle('collapsed');
  toggle.classList.toggle('open');
}

function toggleTheme(){
  const dark = document.body.classList.toggle('dark');
  document.getElementById('theme-btn').textContent = dark ? '◑ light' : '◑ dark';
  localStorage.setItem('shiftlog_theme', dark ? 'dark' : 'light');
}

// Init
const savedTheme = localStorage.getItem('shiftlog_theme');
if(savedTheme === 'dark'){
  document.body.classList.add('dark');
  document.getElementById('theme-btn').textContent = '◑ light';
}

// Default date to today
const today = new Date();
const yyyy = today.getFullYear();
const mm   = String(today.getMonth()+1).padStart(2,'0');
const dd   = String(today.getDate()).padStart(2,'0');
document.getElementById('f-date').value = `${yyyy}-${mm}-${dd}`;

loadWages();
renderAll();
</script>
</body>
</html>
