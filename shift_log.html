<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var t=localStorage.getItem('global_theme');
    if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="./global_theme.css">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Log</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}


body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:13px;line-height:1.6;padding:1.5rem 1rem;transition:background .2s,color .2s;min-height:100vh}
.container{max-width:820px;margin:0 auto}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.75rem}
.page-title{font-size:17px;font-weight:600;letter-spacing:.02em;margin-bottom:2px}
.page-sub{font-size:11px;color:var(--text3);letter-spacing:.03em}
.header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.btn{font-family:inherit;font-size:11px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .15s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--bg4);color:var(--text)}
.btn-green{background:var(--green-bg);color:var(--green-txt);border-color:var(--green)}.btn-green:hover{opacity:.85}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin:1.6rem 0 .55rem;padding-bottom:5px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.sec-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.12em}
.sec-toggle{font-size:14px;color:var(--text3);transition:transform .2s;line-height:1}
.sec-toggle.open{transform:rotate(180deg)}
.sec-body.collapsed{display:none}
hr{border:none;border-top:1px solid var(--border);margin:1.4rem 0}
/* Metrics */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:.5rem 0 1rem}
.met{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.met-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.met-val{font-size:19px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.met-val.green{color:var(--green)}.met-val.blue{color:var(--blue)}.met-val.amber{color:var(--amber)}
.met-sub{font-size:10px;color:var(--text3);margin-top:2px}
/* Entry form */
.entry-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;margin-bottom:1rem}
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:flex-end}
.form-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:110px}
.form-group label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.form-group input,.form-group select,.form-group textarea{font-family:inherit;font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--blue)}
.form-group textarea{resize:vertical;min-height:38px;line-height:1.4}
.form-actions{display:flex;justify-content:flex-end;margin-top:4px}
/* Shift list */
.shift-list{display:flex;flex-direction:column;gap:6px}
.shift-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.shift-item:hover{border-color:var(--border2)}
.si-left{flex:1;min-width:0}
.si-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.si-job{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.si-date{font-size:11px;color:var(--text3)}
.si-times{font-size:12px;color:var(--text2)}
.si-note{font-size:11px;color:var(--text3);margin-top:2px;font-style:italic}
.si-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.si-hours{font-size:13px;font-weight:600;color:var(--text)}
.si-gross{font-size:12px;font-weight:600;color:var(--green)}
.si-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:14px;padding:0;line-height:1;font-family:inherit;transition:color .15s}
.si-del:hover{color:var(--red)}
.empty-state{text-align:center;padding:2rem;color:var(--text3);font-size:12px;border:1px dashed var(--border2);border-radius:var(--r)}
/* Job Details section */
.jobs-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.job-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jc-title-input{font-family:inherit;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);flex:1;min-width:100px;outline:none;transition:border-color .15s}
.jc-title-input:focus{border-color:var(--blue)}
.jc-wage-input{font-family:inherit;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--green);width:80px;text-align:right;outline:none;transition:border-color .15s}
.jc-wage-input:focus{border-color:var(--green)}
.jc-unit-select{font-family:inherit;font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);outline:none}
.jc-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.jc-del{background:none;border:none;color:var(--text4);cursor:pointer;font-size:14px;padding:0 4px;font-family:inherit;transition:color .15s;flex-shrink:0}
.jc-del:hover{color:var(--red)}
.add-job-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border:1px dashed var(--border2);border-radius:var(--r);background:transparent;color:var(--text3);font-family:inherit;font-size:12px;cursor:pointer;transition:all .15s}
.add-job-btn:hover{border-color:var(--blue);color:var(--blue)}
/* Save indicator */
.saving-indicator{position:fixed;bottom:1rem;right:1rem;background:var(--green-bg);color:var(--green-txt);border:1px solid var(--green);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
.saving-indicator.show{opacity:1}
#auth-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center}
</style>

</head>
<body>
<div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
<div id="auth-overlay">
  <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:32px 36px;text-align:center;max-width:360px;width:90%">
    <div style="font-size:17px;font-weight:600;margin-bottom:6px;color:var(--text)">Paul's Tools</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:24px">Sign in to access your data</div>
    <button id="signin-btn" style="font-family:inherit;font-size:13px;font-weight:600;padding:10px 24px;border-radius:20px;border:1.5px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;width:100%">Sign in with Google</button>
  </div>
</div>
<div class="saving-indicator" id="saving-indicator">Saved</div>

<div class="container">
  <div class="header">
    <div>
      <div class="page-title">Paul's Shift Log</div>
      <div class="page-sub">hours & earnings tracker</div>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn">← home</a>
      <button class="btn" onclick="toggleTheme()" id="theme-btn">◑ dark</button>
      <button class="btn" id="signout-btn" style="display:none">Sign out</button>
    </div>
  </div>

  <!-- Summary metrics -->
  <div class="pgrid">
    <div class="met"><div class="met-label">Total Hours</div><div class="met-val blue" id="met-hours">0.0</div><div class="met-sub">all jobs</div></div>
    <div class="met"><div class="met-label">Total Gross</div><div class="met-val green" id="met-gross">$0.00</div><div class="met-sub">before tax</div></div>
    <div class="met"><div class="met-label">Shifts Logged</div><div class="met-val" id="met-shifts">0</div><div class="met-sub">all time</div></div>
    <div class="met"><div class="met-label">This Week</div><div class="met-val amber" id="met-week">$0.00</div><div class="met-sub">gross earnings</div></div>
  </div>

  <!-- Per-job breakdown -->
  <div class="sec-header" onclick="toggleSec('breakdown')"><span class="sec-label">Per-Job Breakdown</span><span class="sec-toggle open" id="toggle-breakdown">▼</span></div>
  <div class="sec-body" id="sec-breakdown"><div class="pgrid" id="job-breakdown"></div></div>

  <!-- Log shift -->
  <div class="sec-header" onclick="toggleSec('entry')"><span class="sec-label">Log a Shift</span><span class="sec-toggle open" id="toggle-entry">▼</span></div>
  <div class="sec-body" id="sec-entry">
    <div class="entry-card">
      <div class="form-row">
        <div class="form-group"><label>Job</label><select id="f-job" onchange="updateShiftFormForJob()"></select></div>
        <div class="form-group"><label>Date</label><input type="date" id="f-date"></div>
      </div>
      <div id="time-fields" class="form-row">
        <div class="form-group" style="max-width:110px"><label>Clock In</label><input type="time" id="f-in"></div>
        <div class="form-group" style="max-width:110px"><label>Clock Out</label><input type="time" id="f-out"></div>
      </div>
      <div id="stipend-fields" class="form-row" style="display:none">
        <div class="form-group">
          <label>Stipend Shift</label>
          <div style="display:flex;align-items:center;gap:10px;padding:7px 11px;background:var(--bg-input);border:1px solid var(--border2);border-radius:8px">
            <input type="checkbox" id="f-stipend" style="width:auto;border:none;box-shadow:none" checked>
            <span style="font-size:12px;color:var(--text-secondary)" id="stipend-rate-label">1 night shift</span>
          </div>
        </div>
      </div>
      <div class="form-row"><div class="form-group"><label>Note (optional)</label><textarea id="f-note" placeholder="e.g. desk coverage, event setup..."></textarea></div></div>
      <div class="form-actions"><button class="btn btn-green" onclick="logShift()">+ Log Shift</button></div>
    </div>
  </div>

  <!-- Shift history -->
  <div class="sec-header" onclick="toggleSec('history')"><span class="sec-label">Shift History</span><span class="sec-toggle open" id="toggle-history">▼</span></div>
  <div class="sec-body" id="sec-history"><div class="shift-list" id="shift-list"></div></div>

  <hr>

  <!-- Job Details -->
  <div class="sec-header" onclick="toggleSec('jobs')"><span class="sec-label">Job Details</span><span class="sec-toggle" id="toggle-jobs">▼</span></div>
  <div class="sec-body collapsed" id="sec-jobs">
    <div class="jobs-list" id="jobs-list"></div>
    <button class="add-job-btn" onclick="addJob()"><span style="font-size:16px;font-weight:300">+</span> Add Job</button>
  </div>
</div>

<script type="module">
import { signIn, signOutUser, onAuth, getBlob, setBlob, getCollection, addToCollection, deleteFromCollection } from './firebase-config.js';

let shifts = [], jobs = [], UID = null;

// Default jobs if none exist
const DEFAULT_JOBS = [
  {id:'j1', title:'SESP',          wage:10.25, unit:'hrs'},
  {id:'j2', title:'Honors Center', wage:10.25, unit:'hrs'},
  {id:'j3', title:'Internship',    wage:15.00, unit:'hrs'},
];

// ── AUTH ────────────────────────────────────────────────
document.getElementById('signin-btn').onclick = () => signIn();
document.getElementById('signout-btn').onclick = () => signOutUser();

onAuth(async user => {
  if(user){
    UID = user.uid;
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('signout-btn').style.display = 'block';
    await loadAll();
  } else {
    UID = null;
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('signout-btn').style.display = 'none';
  }
});

async function loadAll(){
  const [shiftsData, jobsData] = await Promise.all([
    getCollection('shifts'),
    getBlob('shift_jobs'),
  ]);
  shifts = shiftsData.sort((a,b)=> new Date(b.date+' '+(b.inT||'')) - new Date(a.date+' '+(a.inT||'')));
  jobs   = jobsData?.jobs || DEFAULT_JOBS;
  renderJobSelect();
  renderJobsList();
  renderAll();
}

function showSaved(){
  const el = document.getElementById('saving-indicator');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1500);
}

async function saveJobs(){
  await setBlob('shift_jobs', {jobs});
  showSaved();
}

// ── JOB DETAILS ─────────────────────────────────────────
function renderJobsList(){
  const list = document.getElementById('jobs-list');
  list.innerHTML = '';
  jobs.forEach((j,i) => {
    const div = document.createElement('div');
    div.className = 'job-card';
    div.innerHTML = `
      <span class="jc-label">Title</span>
      <input class="jc-title-input" value="${esc(j.title)}" placeholder="Job title"
        oninput="updateJobField('${j.id}','title',this.value)">
      <span class="jc-label">Wage $</span>
      <input class="jc-wage-input" type="number" step="0.25" value="${j.wage||''}" placeholder="0.00"
        oninput="updateJobField('${j.id}','wage',+this.value)">
      <span class="jc-label">Unit</span>
      <select class="jc-unit-select" onchange="updateJobField('${j.id}','unit',this.value)">
        <option value="hrs" ${j.unit==='hrs'?'selected':''}>hrs</option>
        <option value="nights" ${j.unit==='nights'?'selected':''}>nights</option>
      </select>
      <button class="jc-del" onclick="removeJob('${j.id}')" title="Remove job">✕</button>
    `;
    list.appendChild(div);
  });
  renderJobSelect();
}

window.updateShiftFormForJob = function(){
  const jobId = document.getElementById('f-job').value;
  const job = jobs.find(j=>j.id===jobId);
  const isNights = job?.unit === 'nights';
  document.getElementById('time-fields').style.display = isNights ? 'none' : 'flex';
  document.getElementById('stipend-fields').style.display = isNights ? 'flex' : 'none';
  if(isNights && job){
    document.getElementById('stipend-rate-label').textContent = `1 ${job.unit} @ $${job.wage.toFixed(2)} = $${job.wage.toFixed(2)}`;
  }
};

function renderJobSelect(){
  const sel = document.getElementById('f-job');
  const current = sel.value;
  sel.innerHTML = jobs.map(j=>`<option value="${esc(j.id)}">${esc(j.title)}</option>`).join('');
  if(jobs.find(j=>j.id===current)) sel.value = current;
  updateShiftFormForJob();
}

window.addJob = function(){
  jobs.push({id:'j'+Date.now(), title:'New Job', wage:0, unit:'hrs'});
  renderJobsList();
  saveJobs();
};

window.removeJob = function(id){
  if(jobs.length<=1){ alert('At least one job is required.'); return; }
  jobs = jobs.filter(j=>j.id!==id);
  renderJobsList();
  saveJobs();
};

window.updateJobField = function(id, field, val){
  const j = jobs.find(x=>x.id===id);
  if(j){ j[field]=val; renderJobSelect(); renderAll(); saveJobs(); }
};

// ── SHIFT LOG ────────────────────────────────────────────
function parseHours(inT, outT){
  if(!inT||!outT) return 0;
  const [ih,im]=inT.split(':').map(Number),[oh,om]=outT.split(':').map(Number);
  let mins=(oh*60+om)-(ih*60+im); if(mins<0) mins+=24*60;
  return Math.round(mins/60*100)/100;
}
function fmt$(n){ return '$'+n.toFixed(2); }

window.logShift = async function(){
  const jobId = document.getElementById('f-job').value;
  const job   = jobs.find(j=>j.id===jobId);
  const date  = document.getElementById('f-date').value;
  const note  = document.getElementById('f-note').value.trim();
  const isStipend = job?.unit === 'nights';
  if(!date){ alert('Please enter a date.'); return; }
  let hours, inT = '', outT = '';
  if(isStipend){
    // Stipend shift: 1 unit = 1 night, gross = wage directly
    hours = 1;
  } else {
    inT  = document.getElementById('f-in').value;
    outT = document.getElementById('f-out').value;
    if(!inT||!outT){ alert('Please fill in clock-in and clock-out.'); return; }
    hours = parseHours(inT, outT);
    if(hours<=0){ alert('Clock-out must be after clock-in.'); return; }
  }
  const shift = {jobId, jobTitle: job?.title||'Unknown', date, inT, outT, note, hours, isStipend: isStipend||false};
  const id = await addToCollection('shifts', shift);
  shifts.unshift({...shift, id});
  document.getElementById('f-note').value='';
  document.getElementById('f-in').value='';
  document.getElementById('f-out').value='';
  showSaved(); renderAll();
};

window.deleteShift = async function(id){
  await deleteFromCollection('shifts', id);
  shifts = shifts.filter(s=>s.id!==id);
  showSaved(); renderAll();
};

function getJobWage(jobId){
  const j = jobs.find(x=>x.id===jobId);
  return j?.wage||0;
}

function getWeekGross(){
  const now=new Date(), day=now.getDay();
  const monday=new Date(now); monday.setDate(now.getDate()-(day===0?6:day-1)); monday.setHours(0,0,0,0);
  return shifts.filter(s=>new Date(s.date+'T00:00:00')>=monday).reduce((s,x)=>s+x.hours*getJobWage(x.jobId),0);
}

function renderAll(){
  const totalHours = shifts.reduce((s,x)=>s+x.hours,0);
  const totalGross = shifts.reduce((s,x)=>s+x.hours*getJobWage(x.jobId),0);
  document.getElementById('met-hours').textContent  = totalHours.toFixed(1);
  document.getElementById('met-gross').textContent  = fmt$(totalGross);
  document.getElementById('met-shifts').textContent = shifts.length;
  document.getElementById('met-week').textContent   = fmt$(getWeekGross());

  // Per-job breakdown
  const bd = document.getElementById('job-breakdown'); bd.innerHTML='';
  jobs.forEach(j=>{
    const jShifts = shifts.filter(s=>s.jobId===j.id);
    const jHours  = jShifts.reduce((s,x)=>s+x.hours,0);
    const jGross  = jHours*(j.wage||0);
    const div=document.createElement('div'); div.className='met';
    div.innerHTML=`<div class="met-label" style="color:var(--blue)">${esc(j.title)}</div><div class="met-val">${jHours.toFixed(1)}h</div><div class="met-sub">${fmt$(jGross)} gross</div>`;
    bd.appendChild(div);
  });

  // Shift list
  const list=document.getElementById('shift-list');
  if(shifts.length===0){ list.innerHTML='<div class="empty-state">No shifts logged yet. Clock in above.</div>'; return; }
  list.innerHTML='';
  shifts.forEach(s=>{
    const gross=s.hours*getJobWage(s.jobId);
    const fmtDate=new Date(s.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    const div=document.createElement('div'); div.className='shift-item';
    div.innerHTML=`
      <div class="si-left">
        <div class="si-top"><span class="si-job" style="color:var(--blue)">${esc(s.jobTitle||s.jobId)}</span><span class="si-date">${fmtDate}</span>${s.isStipend?'<span class="pill pill-a">Stipend</span>':''}</div>
        <div class="si-times">${s.isStipend ? '1 night shift' : s.inT+' → '+s.outT}</div>
        ${s.note?`<div class="si-note">${esc(s.note)}</div>`:''}
      </div>
      <div class="si-right">
        <span class="si-hours">${s.isStipend ? '1 night' : s.hours.toFixed(1)+'h'}</span>
        <span class="si-gross">${fmt$(gross)}</span>
        <button class="si-del" onclick="deleteShift('${s.id}')">✕</button>
      </div>`;
    list.appendChild(div);
  });
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
window.toggleSec = function(n){ document.getElementById('sec-'+n).classList.toggle('collapsed'); document.getElementById('toggle-'+n).classList.toggle('open'); };
window.toggleTheme = function(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = isDark ? '◑ dark' : '◑ light';
  try{ localStorage.setItem('global_theme', isDark ? 'light' : 'dark'); }catch(e){}
};

// Init theme
// Apply theme
(function(){
  const t = localStorage.getItem('global_theme');
  document.documentElement.setAttribute('data-theme', t==='dark' ? 'dark' : 'light');
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = t==='dark' ? '◑ light' : '◑ dark';
})();
const today=new Date();
document.getElementById('f-date').value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

// Register service worker for PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
